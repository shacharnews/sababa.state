<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>רפובליקת סבבה</title>
<meta name="description" content="כל עוקב הוא אזרח עם בית, רכב, עבודה וכתובת. מצאו את הבית שלכם ברפובליקת סבבה.">
<meta name="theme-color" content="#0e1726">
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:rgba(255,255,255,.78); --bg-strong:rgba(255,255,255,.94); --fg:#0f172a; --fg2:#5b6475; --hair:rgba(15,23,42,.08);
  --accent:#0f8b8d; --accent-2:#e07a4f; --tint:rgba(15,139,141,.1); --shadow:0 10px 30px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.06);
}
body.night{ --bg:rgba(16,22,36,.72); --bg-strong:rgba(18,25,41,.94); --fg:#eef2fb; --fg2:#9aa6bd; --hair:rgba(255,255,255,.09);
  --accent:#f5b759; --accent-2:#ff8a65; --tint:rgba(245,183,89,.14); --shadow:0 10px 30px rgba(0,0,0,.45) }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Heebo,system-ui,sans-serif;color:var(--fg);background:#0e1726}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.glass{background:var(--bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);transition:background .6s,color .6s}
#gl{position:fixed;inset:0;touch-action:none}
#gl canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#labels *{pointer-events:none}
/* the label layer must be LTR: in an RTL page, absolutely positioned labels are measured from the right edge, which pushed every label sideways */
#labels{direction:ltr}
#labels>div{left:0;top:0}
.lbl,.marker{direction:rtl}

/* ---------- map labels ---------- */
.lbl{font-family:Heebo,sans-serif;white-space:nowrap;text-align:center;color:var(--fg);transition:color .6s}
.lbl.city{background:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:5px 14px 6px;box-shadow:var(--shadow);font-weight:800;font-size:16px;letter-spacing:-.2px;line-height:1.15}
.lbl.city small{display:block;font-size:11px;font-weight:500;color:var(--fg2)}
.lbl.tag{background:var(--bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl.tag.gov{background:var(--accent);color:#fff}
body.night .lbl.tag.gov{color:#1b1406}
.lbl.pl{background:var(--bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:10px;padding:3px 10px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none}
.lbl.pl.gov{background:var(--accent);color:#fff}
body.night .lbl.pl.gov{color:#1b1406}
/* the names of places float over the 3D map only when asked for (the city map has them all); on a walk the ones nearby are shown */
body:not(.names):not(.walking) .lbl.pl,body:not(.names):not(.walking) .lbl.st{display:none}
.cmap{position:fixed;inset:0;z-index:60;background:#4aa3c7;display:none;flex-direction:column}
body.cmapon .cmap{display:flex}
.cmh{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;max-width:640px;margin:0 auto;border-radius:20px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;z-index:2}
.cmh b{flex:1;font-size:17px;font-weight:800}.cmh button{width:36px;height:36px;border-radius:50%;background:var(--tint);font-size:16px;flex:none}
.cmh label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg2);white-space:nowrap}
#cmC{flex:1;width:100%;min-height:0;touch-action:none;cursor:grab}
.cmb{background:var(--bg-strong);border-radius:22px 22px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.18);max-height:42vh;display:flex;flex-direction:column;gap:8px}
.cmb input{width:100%;border-radius:14px;padding:11px 14px;font-size:15px;background:var(--tint);border:0;color:var(--fg)}
.cml{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.cmsel{display:none;background:var(--tint);border-radius:16px;padding:10px 12px}.cmsel.on{display:block}
.cmsel b{display:block;font-size:16px}.cmsel small{color:var(--fg2);font-size:12.5px}.cmsel .btns{margin-top:8px}
.wnav{position:absolute;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);border-radius:999px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;max-width:92vw}
.wnav[hidden]{display:none}.wnav i{font-style:normal;display:inline-block;font-size:20px;transition:transform .15s}.wnav button{width:26px;height:26px;border-radius:50%;background:var(--tint);font-size:12px}
.wmapbtn{position:absolute;right:30px;bottom:calc(206px + env(safe-area-inset-bottom));border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.lbl.st{background:rgba(255,255,255,.88);color:#1b2430;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.18);pointer-events:none}
body.night .lbl.st{background:rgba(20,26,36,.85);color:#f1ece0}
.lbl.lock{font-size:11px;font-weight:500;color:#fff;background:rgba(15,23,42,.45);border-radius:999px;padding:2px 9px}
.marker{display:flex;flex-direction:column;align-items:center}
.marker .bub{background:var(--accent-2);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:5px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.marker .stem{width:3px;height:16px;background:var(--accent-2);border-radius:2px}
.marker .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 5px rgba(224,122,79,.3)}
.marker.alt .bub,.marker.alt .stem,.marker.alt .dot{background:var(--accent)}

/* ---------- top bar ---------- */
.top{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:10px;left:10px;display:flex;justify-content:space-between;align-items:center;border-radius:20px;padding:8px 10px 8px 8px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-align:right}
.brand svg{width:40px;height:auto;border-radius:6px;display:block;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--fg2);font-weight:500}
.clock{display:flex;align-items:center;gap:6px;background:var(--tint);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.clock small{font-weight:500;color:var(--fg2);font-size:12px}
.zoom{position:fixed;z-index:3;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.zoom button{width:44px;height:44px;font-size:20px;font-weight:500;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--hair)}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:3;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:24px;padding:10px;max-width:640px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:16px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;font-weight:500;color:var(--fg);padding:11px 0}
.search input::placeholder{color:var(--fg2)}
.search button{color:var(--accent);font-weight:800;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px}
.tabs button{position:relative}.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:2px;left:calc(50% - 20px);background:#e5484d;color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:21px;border-radius:12px}
.tabs button span{font-size:11.5px;font-weight:600;color:var(--fg2)}
.tabs button:active{background:var(--tint)}
.toast{position:fixed;z-index:6;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:.3s;border-radius:16px;padding:10px 16px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(5,10,20,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer{position:fixed;z-index:10;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:84vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--bg-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.9,.25,1),background .6s}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.grab{width:40px;height:5px;border-radius:3px;margin:8px auto 0;background:rgba(127,127,127,.35)}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 18px 10px}
.dhead h2{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.dhead button{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:16px;color:var(--fg2)}
.dhead button[hidden]{display:none}
.dbody{overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.sec{font-size:13px;font-weight:700;color:var(--fg2);margin:18px 4px 8px;letter-spacing:.2px}
.list{background:var(--tint);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;text-decoration:none}
.li+.li{border-top:1px solid var(--hair)}
button.li:active{background:var(--hair)}
.li .ic{width:38px;height:38px;border-radius:11px;background:var(--bg-strong);display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-weight:700;font-size:15.5px}
.li small{display:block;color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{color:var(--fg2);font-size:18px}
.hero{border-radius:20px;padding:16px;background:var(--tint);margin-top:4px}
.hero p{margin:0;color:var(--fg2);line-height:1.55}
.hero b{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:var(--tint);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{color:var(--fg2);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none}
body.night .btn{color:#1b1406}
.btn.ghost{background:var(--tint);color:var(--fg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.bar{height:8px;border-radius:999px;background:var(--hair);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.barl{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:5px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- id card ---------- */
.idc{position:relative;border-radius:22px;padding:18px;color:#fff;overflow:hidden;aspect-ratio:1.586;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(135deg,#0f8b8d 0%,#1d4e89 60%,#2a2d6e 100%);box-shadow:0 18px 40px rgba(29,78,137,.35)}
.idc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.idc-top{display:flex;align-items:center;gap:10px}
.idc-top svg{width:44px;height:auto;border-radius:5px}
.idc-top b{display:block;font-size:16px;font-weight:800}
.idc-top small{display:block;font-size:10px;letter-spacing:1.5px;opacity:.75}
.idc-chip{position:absolute;left:18px;top:20px;width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f6d27a,#c99a3d)}
.idc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:auto;position:relative;z-index:1}
.idc-grid div{min-width:0}
.idc-grid small{display:block;font-size:10px;opacity:.7;letter-spacing:.3px}
.idc-grid span{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idc-grid .wide{grid-column:1/-1}
.idc-num{font-size:24px;font-weight:800;letter-spacing:2px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:12px;position:relative;z-index:1}

/* ---------- reel studio ---------- */
body.rec .top,body.rec .zoom,body.rec .dock,body.rec #labels,body.rec .toast{display:none}
body.rec #gl{display:grid;place-items:center;background:#000}
#recBar{position:fixed;z-index:15;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;font-weight:700;font-size:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.rec #recBar{display:flex}
#recBar i{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:blink 1s infinite}
#recBar button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700}
@keyframes blink{50%{opacity:.2}}
.reelvid{width:100%;max-height:56vh;border-radius:18px;background:#000;display:block}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{background:var(--tint);border-radius:18px;padding:14px 12px;text-align:right}
.tpl button b{display:block;font-size:15px;margin-top:6px}.tpl button small{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.tpl button span{font-size:26px}
.tpl button:disabled,.tpl button.off{opacity:.45}
.ballot{background:var(--tint);border-radius:18px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ballot.closed{opacity:.9}.bhead{display:flex;gap:10px;align-items:center}.bhead span{font-size:26px}.bhead b{display:block;font-size:16px}.bhead small{color:var(--fg2);font-size:12.5px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg-strong);border-radius:14px;padding:12px 14px;text-align:right;min-height:50px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.opt i{position:absolute;inset:0 0 0 auto;background:var(--tint);border-radius:14px;transition:width .5s}
.opt .ol,.opt .op{position:relative;font-weight:700}.opt .ol small{display:block;font-weight:500;color:var(--fg2);font-size:11.5px}.opt .op{font-variant-numeric:tabular-nums;color:var(--fg2)}
.opt.mine{box-shadow:inset 0 0 0 2px var(--accent)}.opt.win{box-shadow:inset 0 0 0 2px #e2b33a}.opt:disabled{cursor:default}
details.adm{background:var(--tint);border-radius:18px;padding:4px 12px;margin-top:10px}details.adm[open]{padding-bottom:12px}
details.adm summary{font-weight:800;font-size:15.5px;padding:10px 0;cursor:pointer}
details.adm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--fg2);margin-top:8px}
details.adm input,details.adm select,details.adm textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:8px 10px}
details.adm input[type=color]{height:42px;padding:2px}details.adm .btn{width:100%;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--fg2);margin-top:8px}
.adm input,.adm select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:8px 10px}
.adm label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px}.adm label.chk input{width:22px;height:22px}
.adm .btn{width:100%;margin-top:10px}.btn.danger{color:#e5484d}
.mini{background:var(--bg-strong);border-radius:10px;padding:6px 9px;font-size:12.5px;font-weight:700;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:var(--tint);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px}
.scene{background:var(--tint);border-radius:18px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;align-items:center;justify-content:space-between}.shead b{font-size:15px}
.shead span{display:flex;gap:4px}.shead button{width:32px;height:32px;border-radius:10px;background:var(--bg-strong)}.shead button:disabled{opacity:.3}
.scene label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--fg2)}
.scene select,.scene input{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:8px 10px}
.row3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:6px}
.tpl .hero-tpl{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,182,39,.25),var(--tint))}
.reelprev{height:min(100vh,177.8vw);width:auto;max-width:100vw;display:block}
body.rec #gl canvas:not(.reelprev){position:absolute;left:-99999px}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:6px 8px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vrow{background:var(--tint);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.vrow.done{box-shadow:inset 0 0 0 2px rgba(15,139,141,.35)}
.vtx{flex:1;min-width:0}.vtx small{display:block;color:var(--fg2);font-size:11.5px}.vtx b{display:block;font-size:15px;line-height:1.35}
.vbtn{display:flex;align-items:center;gap:6px;flex:none}
.vbtn button{background:var(--bg-strong);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.vbtn button.rec{background:#e5484d;color:#fff}.vbtn button.rec.on{animation:blink 1s infinite}
.vbtn button:disabled{opacity:.4}.vdur{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--fg2);text-align:center;margin:8px 0 0}
.hero.warn{background:rgba(224,122,79,.16)}
code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;direction:ltr;unicode-bidi:embed;white-space:normal}
.li small code{white-space:normal}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-inline-start:4px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
/* ---------- wallet, shop, achievements ---------- */
.wallet{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}
.wallet div{background:var(--tint);border-radius:16px;padding:10px 8px;text-align:center}
.wallet small{display:block;color:var(--fg2);font-size:12px}.wallet b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.55}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ach button{background:var(--tint);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;filter:grayscale(1);opacity:.45}
.ach button.on{filter:none;opacity:1;background:linear-gradient(160deg,rgba(255,182,39,.28),var(--tint))}
.ach span{font-size:24px}.ach small{font-size:10.5px;font-weight:600;line-height:1.15;text-align:center}

  document.body.classList.add("open");

// a city with no free estate gets a new estate block: the nearest empty block next to the houses (wide blocks first), on dry land inside the city
function estateSpot(slot) {
  const si = S.slots.indexOf(slot), res = new Set([...reservedBlocks(slot, si), ...extraBlocks(slot, si)].map(b => b.join(","))), cand = [];
  const bl = [...slot.blocks.values()], xs = bl.map(b => b.bx), zs = bl.map(b => b.bz);
  for (let bx = Math.min(...xs) - 2; bx <= Math.max(...xs) + 2; bx++) for (let bz = Math.min(...zs) - 2; bz <= Math.max(...zs) + 2; bz++) {
    const k = bx + "," + bz; if (slot.blocks.has(k) || res.has(k) || isCentral(si, bx, bz) || S.zones?.has(`${slot.at}:${k}`) || OPEN_KINDS.includes(blockKind(slot, bx, bz))) continue;
    if (![[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => { const n = slot.blocks.get(`${bx + a},${bz + b}`); return n && !n.civic; })) continue;
    const cx = slot.x + BPX(bx), cz = slot.z + BPZ(bz);
    if (![[-22, -HZ - 1], [22, -HZ - 1], [-22, HZ + 1], [22, HZ + 1]].every(([dx, dz]) => onGrass(cx + dx, cz + dz, MAX_S, .04) && inTerritory(cx + dx, cz + dz, slot))) continue;
    cand.push({ k, d: Math.hypot(BPX(bx), BPZ(bz)) + (bwX(bx) > BX ? 0 : 400) });
  }
  cand.sort((a, b) => a.d - b.d); return cand[0] ? `${slot.at}:${cand[0].k}` : null;
}

// one form for every kind of thing on the map; saves through admin_edit (upgrade-8.sql)
function applySettings(rows) {
  for (const g of GOV) { g.orig ||= g.name; g.name = g.orig; }
  BALLOT.orig ||= BALLOT.name; BALLOT.name = BALLOT.orig;
  S.houseSign = new Map();   // house_<username> = { text, color }: the name and color on a special house
  S.blkCfg = new Map();      // blk_<city site>_<bx>_<bz> = { name, center, trees, benches, cafe, ground, noSign, items: [...] }: how the admin dressed a square or a public lot
  for (const r of rows || []) if (r.key?.startsWith("blk_") && r.value) S.blkCfg.set(r.key, r.value);
  S.zones = new Map();       // zone_<site>_<bx>_<bz> = { kind }: what a block of the city is (houses, a lane, a square, a roundabout, a park, a public lot)
  for (const r of rows || []) { const m = r.key?.match(/^zone_(\d+)_(-?\d+)_(-?\d+)$/); if (m && r.value?.kind) S.zones.set(`${m[1]}:${m[2]},${m[3]}`, r.value.kind); }
  S.wpCfg = new Map();       // wp_<workplace id> = { look: "bow", x, z, ry, lot }: a special design, and a place on the map the admin picked
  for (const r of rows || []) if (r.key?.startsWith("wp_") && r.value) S.wpCfg.set(+r.key.slice(3), r.value);
  for (const r of rows || []) if (r.key?.startsWith("house_") && r.value) S.houseSign.set(r.key.slice(6), r.value);
  S.credits = (rows || []).find(r => r.key === "credits")?.value || {};
  S.spots = new Map();       // an estate bought where the city had no free estate: the site picked a new block for it ("<site>:<bx>,<bz>"), and it becomes estates
  for (const [u, v] of S.houseSign) if (v?.place === "estate" && /^\d+:-?\d+,-?\d+$/.test(v.spot || "")) { if (!S.zones.has(v.spot)) S.zones.set(v.spot, "estate"); S.spots.set(v.spot, u); }
  for (const r of rows || []) { const v = typeof r.value === "string" ? r.value : r.value?.name;
    if (!v) continue; const g = GOV.find(q => "gov_" + q.id === r.key); if (g) g.name = v; if (r.key === "ballot_name") BALLOT.name = v; }
}

}

    <div class="adm" style="background:var(--tint);border-radius:18px;padding:4px 12px 12px;margin-top:10px">${fields.map(([k, label, type, options]) => type === "select"

      : type === "check" ? `<label class="chk"><input type="checkbox" data-k="${k}" ${values[k] ? "checked" : ""}> ${label}</label>`
      : `<label>${label}<input data-k="${k}" type="${type || "text"}" value="${esc(values[k] ?? "")}" ${type === "number" ? 'step="any"' : type === "color" ? 'style="height:46px;padding:4px 6px"' : ""} ${/user|by|url/.test(k) ? 'dir="ltr" autocapitalize="off"' : ""}></label>`).join("")}
      <button class="btn" id="edSave">💾 לשמור</button>${onDelete ? `<button class="btn ghost danger" id="edDel">🗑 למחוק</button>` : ""}</div>`, () => {
    const read = () => { const o = {}; $("dBody").querySelectorAll("[data-k]").forEach(el => o[el.dataset.k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? null : +el.value) : el.value.trim()); return o; };

  }, true);
}

  [...BLK_META.entries()].filter(([, m]) => ["central", "square", "round", "park"].includes(m.kind) || (m.kind === "lot" && m.title !== "מגרש ציבורי"))

    o.push([`lot:${si}:${k}`, p ? `${PROJECT_KINDS[p.kind]?.[0] || "🏗️"} ${p.name || PROJECT_KINDS[p.kind]?.[1]}` : `🟫 מגרש ציבורי ${k + 1} · ${sl.city?.name || ""}`]); }));
  for (const w of S.workplaces) if (w.x != null) o.push([`work:${w.id}`, `${KIND_IC[w.kind] || "💼"} ${w.name} · ${cityName(w.city_id)}`]);

}
function placeOf(sc) {

  if (t === "coast") { const c = COAST.find(q => q.id === a); if (c?.x != null) return { o: c, zoom: 3.4 }; }
  if (t === "palm" && PALM.geo) return a === "hotel" ? { o: PALM.geo.hotel, zoom: 3.2 } : { o: PALM.geo.center, zoom: 1.5 };
  if (t === "blk") { const m = BLK_META.get(a); if (m) return { o: { x: m.cx, z: m.cz }, zoom: m.kind === "central" ? 3.2 : m.kind === "round" ? 6 : 5 }; }
  if (t === "lot") { const sp = S.slots[+a]?.publicSpots?.[+b]; if (sp) return { o: { x: sp[0], z: sp[1] }, zoom: 4.6 }; }
  if (t === "work") { const w = S.wpById.get(+a); if (w?.x != null) return { o: w, zoom: 5.5 }; }
  if (t === "ballot" && BALLOT.x != null) return { o: BALLOT, zoom: 5 };
  if (t === "mon") { const p = S.projects.find(q => q.id === +a); if (p?.x != null) return { o: p, zoom: 1.5 }; }
  if (t === "house") { const h = S.byUser.get(clean(sc.u || "")); if (h?.lot) return { o: h, zoom: 9, mark: h }; }
  return { o: ORIGIN, zoom: zf };
}
function customShots() {
  const zf = reelFit(), list = []; let az = -.5;
  CUSTOM.scenes.forEach((sc, i) => {
    const p = placeOf(sc), el = { high: undefined, street: LOW, orbit: .55, top: 1.25 }[sc.view], tm = TIMES[sc.time] || TIMES.noon, ds = DISTS[sc.dist] || DISTS.normal;
    const d = Math.max(1.5, Math.min(8, +sc.d || 3)), base = { d, h: [tm[1], tm[2]], cap: sc.cap || "", sub: sc.sub || "" };
    if (String(sc.place).startsWith("inside:")) {   // inside a building: circle around the room
      const rest = sc.place.slice(7), w = rest === "home" ? interiorTarget("home:" + clean(sc.u || "")) : interiorTarget(rest);
      if (w) { const e = { high: .62, street: .28, orbit: .45, top: 1.05 }[sc.view] ?? .5, sweep = sc.view === "orbit" ? .9 : .35;
        list.push({ ...base, inside: w, a: { az: .25, dist: ds[2] * 1.12, el: e }, b: { az: .25 + sweep, dist: ds[2], el: e } }); return; }
    }
    az += sc.view === "orbit" ? 1.1 : .4;
    const prev = list.at(-1), from = !i || prev?.inside ? at(p.o, (p.o === ORIGIN ? zf : p.zoom) * ds[1] * .7, az - .5, el) : undefined;
    list.push({ ...base, a: from, b: at(p.o, (p.o === ORIGIN ? zf : p.zoom) * (p.o === ORIGIN ? Math.min(1, ds[1]) : ds[1]), az, el), mark: p.mark });
  });
  return chain(list);
}

/* ============================ DATA ============================ */
// newest schema first; if an upgrade wasn't run yet, fall back to the older column sets
const COLSETS = ["id,ig_username,city_id,created_at,house_tier,car_tier,workplace_id,job_level,coins,car_model,car_color,house_style,streak,best_streak,last_collected,last_shift,avatar,avatar_owned,food",
  "id,ig_username,city_id,created_at,house_tier,car_tier,workplace_id,job_level,coins,car_model,car_color,house_style,streak,best_streak,last_collected,last_shift,avatar,avatar_owned",
  "id,ig_username,city_id,created_at,house_tier,car_tier,workplace_id,job_level,coins,car_model,car_color,house_style,streak,best_streak,last_collected,last_shift",
  "id,ig_username,city_id,created_at,house_tier,car_tier,workplace_id,job_level", "id,ig_username,city_id,created_at"];
let colset = 0;
async function fetchCitizens() {
  const out = [], step = 1000;
  for (let from = 0; ; from += step) {
    let data;
    try { data = await api(`citizens?select=${COLSETS[colset]}&order=id`, { Range: `${from}-${from + step - 1}` }); }
    catch (e) { if (e.message === "416") break; if (colset < COLSETS.length - 1) { colset++; out.length = 0; from = -step; continue; } throw e; }
    out.push(...data); if (data.length < step) break;
  }
  return out;
}
async function loadData() {
  const [cities, citizens, workplaces] = await Promise.all([api("cities?select=id,name,opens_at,founder_username&order=opens_at"), fetchCitizens(), api("workplaces?select=id,name,kind,city_id,color,floors&order=id").catch(() => api("workplaces?select=id,name,kind,city_id&order=id")).catch(() => [])]);
  S.cities = cities; S.raw = citizens; S.total = citizens.length; S.maxId = citizens.reduce((m, c) => Math.max(m, c.id), 0);
  S.workplaces = workplaces; S.wpById = new Map(workplaces.map(w => [w.id, w]));
  // a city row created before its milestone is only a name waiting for its city
  const live = cities.filter(c => c.opens_at <= citizens.length || !MILESTONES.includes(c.opens_at));
  const slots = SLOTS.map(s => ({ ...s, city: live.find(c => c.opens_at === s.at) || null, named: cities.find(c => c.opens_at === s.at && !live.includes(c)) || null }));
  for (const c of live) if (!slots.some(s => s.city === c)) { const f = slots.find(s => !s.city && !s.named); if (f) f.city = c; }
  S.slots = slots;
}
function loadExtras() {
  return Promise.all([
    api("laws?select=id,title,description,enacted_at,proposed_by&order=enacted_at.desc,id.desc").catch(() => api("laws?select=id,title,description,enacted_at&order=enacted_at.desc,id.desc")).then(d => S.laws = d),
    api("ministers?select=ministry,appointed_at,citizens(ig_username)&order=appointed_at.desc,id.desc").then(d => S.gov = d),
    api("draws?select=id,draw_date,prize,details,citizens(ig_username)&order=id.desc&limit=60").then(d => S.draws = d),

const projSig = list => list.map(p => p.id + p.status).join(",");
async function loadProjects() {

// live updates: once a minute, look for new citizens or a new draw and rebuild the island in place
async function refresh() {
  if (document.hidden || document.body.classList.contains("open") || REEL.on) return;
  try {
    const [top, dr, pr] = await Promise.all([api("citizens?select=id&order=id.desc&limit=1"), api("draws?select=id&order=id.desc&limit=1").catch(() => []),
      api("projects?select=id,status&order=id").catch(() => S.projects)]);
    const maxId = top[0]?.id || 0, drawId = dr[0]?.id || 0, projChanged = projSig(pr) !== projSig(S.projects);
    if (maxId === S.maxId && drawId === (S.draws[0]?.id || 0) && !projChanged) return;
    const before = S.total, doneBefore = S.projects.filter(p => p.status === "done").length;
    await loadData(); await loadExtras(); await loadProjects(); buildWorld();
    const n = S.total - before, done = S.projects.filter(p => p.status === "done").length - doneBefore;
    toast(n > 0 ? `👋 ${fmtN(n)} תושבים חדשים הגיעו לאי` : done > 0 ? "🎉 נחנך מבנה חדש שביקשתם!" : projChanged ? "🏗️ התחילו לבנות משהו חדש" : "🎟️ יש זוכים חדשים בהגרלה");
  } catch {}
}

  initAdmin(qs);
  if (qs.has("debug")) Object.assign(window, { GO, DBG: { routeBetween, cityLots, palm: () => PALM, inw: () => IN, camera, controls, S, Ray: THREE.Raycaster, fig: () => MINE_FIG, walk: WALK, int: INT, npc: () => [...NPC.values()].map(n => n.fig), wcam: walkCam, renderer, WRP, warpXZ, unwarpXZ, terrainH, pickAt: (px, py) => { ndc.set(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); unbendRay(ray); const h = ray.intersectObjects(S.picks, false)[0]; return h ? [h.object.userData.type, h.object.userData.items?.[h.instanceId ?? 0]?.u, h.point.x, h.point.z] : null; } } });
  setTimeout(loadBallot, 3600);
  setInterval(refresh, REFRESH_MS);
}
// admin mode: open the site with ?admin once, type the code that upgrade-5.sql printed, and this phone remembers it
let ADMIN = false;
async function initAdmin(qs) {
  let code = null; try { code = localStorage.getItem("sababa_admin"); } catch {}
  if (qs.has("admin")) {
    const rest = new URLSearchParams(qs); rest.delete("admin"); history.replaceState(null, "", rest.toString() ? "?" + rest : location.pathname);
    code = (prompt("קוד מנהל:") || "").trim(); if (!code) return;
  }
  if (!code) return;
  let ok = false; try { ok = (await rpc("admin_check", { secret: code })) === true; } catch {}
  if (ok) { ADMIN = true; try { localStorage.setItem("sababa_admin", code); } catch {} if (qs.has("admin")) toast("👑 מצב מנהל פעיל. כל תבניות הרילים פתוחות בסטודיו"); }
  else { try { localStorage.removeItem("sababa_admin"); } catch {} if (qs.has("admin")) toast("קוד מנהל שגוי"); }
}
