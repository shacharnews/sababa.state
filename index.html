<title>רפובליקת סבבה</title>

<style>
:root{
  --bg:rgba(255,255,255,.78); --bg-strong:rgba(255,255,255,.94); --fg:#0f172a; --fg2:#5b6475; --hair:rgba(15,23,42,.08);
  --accent:#0f8b8d; --accent-2:#e07a4f; --tint:rgba(15,139,141,.1); --shadow:0 10px 30px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.06);
}
body.night{ --bg:rgba(16,22,36,.72); --bg-strong:rgba(18,25,41,.94); --fg:#eef2fb; --fg2:#9aa6bd; --hair:rgba(255,255,255,.09);
  --accent:#f5b759; --accent-2:#ff8a65; --tint:rgba(245,183,89,.14); --shadow:0 10px 30px rgba(0,0,0,.45) }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Heebo,system-ui,sans-serif;color:var(--fg);background:#0e1726}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.glass{background:var(--bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);transition:background .6s,color .6s}
#gl{position:fixed;inset:0;touch-action:none}
#gl canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#labels *{pointer-events:none}

/* ---------- map labels ---------- */
.lbl{font-family:Heebo,sans-serif;white-space:nowrap;text-align:center;color:var(--fg);transition:color .6s}
.lbl.city{background:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:5px 14px 6px;box-shadow:var(--shadow);font-weight:800;font-size:16px;letter-spacing:-.2px;line-height:1.15}
.lbl.city small{display:block;font-size:11px;font-weight:500;color:var(--fg2)}
.lbl.tag{background:var(--bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl.tag.gov{background:var(--accent);color:#fff}
body.night .lbl.tag.gov{color:#1b1406}
.lbl.lock{font-size:11px;font-weight:500;color:#fff;background:rgba(15,23,42,.45);border-radius:999px;padding:2px 9px}
.marker{display:flex;flex-direction:column;align-items:center}
.marker .bub{background:var(--accent-2);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:5px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.marker .stem{width:3px;height:16px;background:var(--accent-2);border-radius:2px}
.marker .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 5px rgba(224,122,79,.3)}
.marker.alt .bub,.marker.alt .stem,.marker.alt .dot{background:var(--accent)}

/* ---------- top bar ---------- */
.top{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:10px;left:10px;display:flex;justify-content:space-between;align-items:center;border-radius:20px;padding:8px 10px 8px 8px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-align:right}
.brand svg{width:40px;height:auto;border-radius:6px;display:block;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--fg2);font-weight:500}
.clock{display:flex;align-items:center;gap:6px;background:var(--tint);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.clock small{font-weight:500;color:var(--fg2);font-size:12px}
.zoom{position:fixed;z-index:3;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.zoom button{width:44px;height:44px;font-size:20px;font-weight:500;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--hair)}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:3;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:24px;padding:10px;max-width:640px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:16px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;font-weight:500;color:var(--fg);padding:11px 0}
.search input::placeholder{color:var(--fg2)}
.search button{color:var(--accent);font-weight:800;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:21px;border-radius:12px}
.tabs button span{font-size:11.5px;font-weight:600;color:var(--fg2)}
.tabs button:active{background:var(--tint)}
.toast{position:fixed;z-index:6;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:.3s;border-radius:16px;padding:10px 16px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(5,10,20,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer{position:fixed;z-index:10;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:84vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--bg-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.9,.25,1),background .6s}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.grab{width:40px;height:5px;border-radius:3px;margin:8px auto 0;background:rgba(127,127,127,.35)}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 18px 10px}
.dhead h2{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.dhead button{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:16px;color:var(--fg2)}
.dhead button[hidden]{display:none}
.dbody{overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.sec{font-size:13px;font-weight:700;color:var(--fg2);margin:18px 4px 8px;letter-spacing:.2px}
.list{background:var(--tint);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;text-decoration:none}
.li+.li{border-top:1px solid var(--hair)}
button.li:active{background:var(--hair)}
.li .ic{width:38px;height:38px;border-radius:11px;background:var(--bg-strong);display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-weight:700;font-size:15.5px}
.li small{display:block;color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{color:var(--fg2);font-size:18px}
.hero{border-radius:20px;padding:16px;background:var(--tint);margin-top:4px}
.hero p{margin:0;color:var(--fg2);line-height:1.55}
.hero b{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:var(--tint);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{color:var(--fg2);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none}
body.night .btn{color:#1b1406}
.btn.ghost{background:var(--tint);color:var(--fg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.bar{height:8px;border-radius:999px;background:var(--hair);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.barl{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:5px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- id card ---------- */
.idc{position:relative;border-radius:22px;padding:18px;color:#fff;overflow:hidden;aspect-ratio:1.586;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(135deg,#0f8b8d 0%,#1d4e89 60%,#2a2d6e 100%);box-shadow:0 18px 40px rgba(29,78,137,.35)}
.idc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.idc-top{display:flex;align-items:center;gap:10px}
.idc-top svg{width:44px;height:auto;border-radius:5px}
.idc-top b{display:block;font-size:16px;font-weight:800}
.idc-top small{display:block;font-size:10px;letter-spacing:1.5px;opacity:.75}
.idc-chip{position:absolute;left:18px;top:20px;width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f6d27a,#c99a3d)}
.idc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:auto;position:relative;z-index:1}
.idc-grid div{min-width:0}
.idc-grid small{display:block;font-size:10px;opacity:.7;letter-spacing:.3px}
.idc-grid span{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idc-grid .wide{grid-column:1/-1}
.idc-num{font-size:24px;font-weight:800;letter-spacing:2px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:12px;position:relative;z-index:1}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(180deg,#1b2a4a 0%,#e58a5c 62%,#f4c27d 100%);transition:opacity .8s}
#loader.gone{opacity:0;pointer-events:none}
#loader .in{text-align:center;color:#fff}
#loader svg{width:120px;height:auto;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:float 3s ease-in-out infinite}
#loader h1{font-size:30px;font-weight:300;letter-spacing:-.5px;margin:22px 0 4px}
#loader h1 b{font-weight:800}
#loader p{margin:0;opacity:.8;font-size:14px}
@keyframes float{50%{transform:translateY(-8px)}}
</style>

<div id="loader"><div class="in"><div id="loadFlag"></div><h1>רפובליקת <b>סבבה</b></h1><p id="loadMsg">השמש עולה על האי…</p></div></div>

<nav class="dock glass">

<div class="toast glass" id="toast"></div>

<div class="scrim" id="scrim"></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">

<script type="module">
import * as THREE from "three";

import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

/* ============================ CONFIG ============================ */
const SUPABASE_URL = "https://herjiivecdrwkzudzbap.supabase.co";
const SUPABASE_KEY = "sb_publishable_zhrnwgsOlYlM6gm_77tGlg_ktWHGaZT";
const INSTAGRAM = "sababa.state";
const INDEPENDENCE_DAY = "2026-10-11";   // יום 1 של המדינה
const REFRESH_MS = 60000;                 // בדיקת תושבים חדשים

/* ============================ HELPERS ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => Number(n).toLocaleString("he-IL");
const fmtDate = d => new Date(d).toLocaleDateString("he-IL");
const pad = n => String(n).padStart(6, "0");
const clean = u => String(u).trim().replace(/^@/, "").toLowerCase();
function hash(s) { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let toastT; function toast(t, ms = 2800) { $("toast").textContent = t; $("toast").classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("show"), ms); }
async function api(path, headers = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, ...headers } });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}

/* ============================ FLAG ============================ */
function star(cx, cy, R, r) { const p = []; for (let i = 0; i < 10; i++) { const d = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / 5; p.push((cx + Math.cos(a) * d).toFixed(1) + "," + (cy + Math.sin(a) * d).toFixed(1)); } return p.join(" "); }
const FLAG = (() => {
  const rays = Array.from({ length: 9 }, (_, i) => { const a = Math.PI + (i + .5) * Math.PI / 9;
    return `<line x1="${(150 + Math.cos(a) * 44).toFixed(1)}" y1="${(132 + Math.sin(a) * 44).toFixed(1)}" x2="${(150 + Math.cos(a) * 70).toFixed(1)}" y2="${(132 + Math.sin(a) * 70).toFixed(1)}"/>`; }).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><rect width="300" height="200" fill="#1f6f8b"/><g stroke="#ffb627" stroke-width="9" stroke-linecap="round">${rays}</g><circle cx="150" cy="132" r="36" fill="#ffb627"/><path d="M0 132 Q37.5 118 75 132 T150 132 T225 132 T300 132 V200 H0Z" fill="#f2d79a"/><path d="M0 150 Q37.5 138 75 150 T150 150 T225 150 T300 150" fill="none" stroke="#e2bf73" stroke-width="5"/><polygon fill="#fff" points="${star(150, 172, 13, 5.5)}"/></svg>`;
})();
const FLAG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(FLAG);
$("loadFlag").innerHTML = FLAG; $("hudFlag").innerHTML = FLAG; $("favicon").href = FLAG_URI;

/* ============================ DOMAIN ============================ */
const STREETS = ["שדרות יהיה בסדר","רחוב החומוס","סמטת הפלאפל","דרך סבבה","רחוב אחלה","רחוב תכלס","רחוב יאללה","שביל השקשוקה",
  "רחוב בקטנה","רחוב על האש","סמטת הארטיק","רחוב הקפה השחור","שדרות המייסדים","רחוב חבל על הזמן","רחוב הים","שביל הצבר",
  "רחוב הקומזיץ","דרך המגדלור","רחוב הבורקס","סמטת הנרגילה","רחוב זורמים","רחוב המטקות","רחוב הפיתה","שביל השקיעה",
  "רחוב הגלידה","רחוב הסחלב","רחוב הבמבה","רחוב הקרטיב","רחוב הנענע","רחוב הזית","רחוב התאנה","שדרות הדקלים","רחוב הרימון",
  "רחוב הבוגנוויליה","רחוב הלימון","רחוב הצנובר","רחוב החרוב","רחוב הגפן","רחוב השקד","רחוב הכרכום"];
const HEB = ["", "ב", "ג", "ד", "ה", "ו", "ז", "ח"];
const HOUSE_NAMES = { "1_0": "קוביה לבנה עם דוד שמש", "1_1": "בית קטן עם גג רעפים", "1_2": "בית קטן עם גג אפור",
  "2_0": "בית דו־קומתי עם מרפסת", "2_1": "בית דו־קומתי עם גג רעפים", "3_0": "וילה עם בריכה" };
const CAR_NAMES = { 1: "רכב עירוני קטן", 2: "רכב משפחתי", 3: "רכב ספורט יוקרתי" };
const ROLE = { bakery: "אופה", cafe: "בריסטה", market: "קופאי/ת", school: "מורה", clinic: "אח/ות", garage: "מכונאי/ת",
  hummus: "מגיש/ת חומוס", tech: "מפתח/ת תוכנה", police: "שוטר/ת", fuel: "מתדלק/ת" };
const KIND_IC = { bakery: "🥖", cafe: "☕", market: "🛒", school: "🏫", clinic: "🏥", garage: "🔧", hummus: "🥙", tech: "💻", police: "🚓", fuel: "⛽" };
const LEVEL = ["", "", "ראש/ת צוות", "מנהל/ת", 'מנכ"ל/ית'];
const PRIZES = { luxury_house: ["🏡", "וילה עם בריכה"], luxury_car: ["🏎️", "רכב יוקרה"], minister: ["🏛️", "שר/ה ליום"], promotion: ["📈", "קידום בעבודה"], job_change: ["🔄", "עבודה חדשה"] };
const jobTitle = h => !h.wp ? "מחפש/ת עבודה" : (h.level <= 1 ? `${ROLE[h.wp.kind] || "עובד/ת"} ב${h.wp.name}` : `${LEVEL[Math.min(4, h.level)]} ב${h.wp.name}`);
const addressOf = h => h.lot ? `${h.lot.street} ${h.lot.num}, ${h.city.name}` : `${h.city.name} (הבית בבנייה)`;

/* ============================ WORLD LAYOUT ============================ */
// The island grows with the population. Lot positions never depend on the current size,
// so every address stays the same forever; the island just has to cover the houses.
const RX0 = 820, RZ0 = 700, GRASS = .9, MAX_S = 6;
const shoreF = t => 1 + .07 * Math.sin(3 * t + .6) + .05 * Math.sin(5 * t + 2.1) + .03 * Math.sin(8 * t + .3);
const growth = n => Math.min(MAX_S, .55 + .45 * Math.sqrt(Math.max(0, n) / 1000));
const polar = (x, z, s) => ({ t: Math.atan2(z / (RZ0 * s), x / (RX0 * s)), d: Math.hypot(x / (RX0 * s), z / (RZ0 * s)) });
const onGrass = (x, z, s, m = .03) => { const p = polar(x, z, s); return p.d < GRASS * shoreF(p.t) - m; };

  let need = growth(S.total);
  S.slots.forEach((slot, si) => {
    slot.blocks = new Map(); slot.pop = 0;
    if (!slot.city) return;
    const list = (byCity.get(slot.city.id) || []).sort((a, b) => a.id - b.id), lots = cityLots(slot, si, list.length);
    slot.pop = list.length;
    list.forEach((c, i) => {

      const h = { id: c.id, u: c.ig_username, city: slot.city, slot, lot, tier, style: tier === 1 ? hash(c.ig_username) % 3 : tier === 2 ? hash(c.ig_username) % 2 : 0,
        car: Math.min(3, Math.max(1, c.car_tier || 1)), wp: S.wpById.get(c.workplace_id) || null, level: c.job_level || 1, x: lot ? lot.x : slot.x, z: lot ? lot.z : slot.z };
      S.houses.push(h); S.byUser.set(h.u, h); if (lot) S.byAddr.set(`${lot.street} ${lot.num}`.toLowerCase(), h);
      if (lot) slot.blocks.set(`${lot.bx},${lot.bz}`, { bx: lot.bx, bz: lot.bz });
    });
    for (let bx = -1; bx <= 1; bx++) for (let bz = -1; bz <= 1; bz++) slot.blocks.set(`${bx},${bz}`, { bx, bz, civic: true });

      const x = slot.x + b.bx * BX + dx, z = slot.z + b.bz * BZ + dz, t = Math.atan2(z / RZ0, x / RX0), d = Math.hypot(x / RX0, z / RZ0);

  for (const w of S.workplaces) w.staff = [];
  for (const h of S.houses) if (h.wp) h.wp.staff.push(h);
}

  return +p.find(x => x.type === "hour").value + +p.find(x => x.type === "minute").value / 60;
}
const lerpC = (a, b, k) => C(a).lerp(C(b), k);
function applyTime() {
  const h = timeMode.live ? israelHour() : timeMode.h;
  let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] <= h) i++;
  const a = KEYS[i], b = KEYS[i + 1], k = Math.max(0, Math.min(1, (h - a[0]) / (b[0] - a[0])));
  const sky = lerpC(a[1], b[1], k);
  scene.background = sky; scene.fog.color.copy(sky);
  WATER.color.copy(lerpC(a[2], b[2], k)); SHALLOW.color.copy(WATER.color).lerp(C("#a7e3ee"), .35);
  sun.color.copy(lerpC(a[3], b[3], k)); sun.intensity = a[4] + (b[4] - a[4]) * k;
  hemi.intensity = a[5] + (b[5] - a[5]) * k; hemi.color.copy(sky).lerp(C("#ffffff"), .6);
  const glow = a[6] + (b[6] - a[6]) * k;
  GLOW.emissiveIntensity = glow * 1.6; POOL_MAT.opacity = glow * .55;
  const day = h >= 6 && h <= 18.6, ang = day ? Math.PI * (h - 6) / 12.6 : Math.PI * .3;
  SUN_DIR.set(Math.cos(ang) * .8, Math.max(.32, Math.sin(ang)), .45).normalize();
  document.body.classList.toggle("night", glow > .5);
  document.querySelector('meta[name="theme-color"]').content = "#" + sky.getHexString();
  const hh = Math.floor(h) % 24, mm = Math.floor((h % 1) * 60);
  $("clockT").textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  $("clockIc").textContent = glow > .7 ? "🌙" : h < 9 ? "🌅" : h > 16.5 ? "🌇" : "☀️";
}

/* ============================ CAMERA ============================ */
const fitZoom = () => Math.min(camera.right * 2 / (RX0 * S.s * 2.3), camera.top * 2 / (RZ0 * S.s * 2.2));
const setZoom = z => { camera.zoom = Math.max(controls.minZoom, Math.min(controls.maxZoom, z)); camera.updateProjectionMatrix(); };
let fly = null;
function flyTo(x, z, zoom, ms = 1200) {
  const t0 = performance.now(), a = controls.target.clone(), off = camera.position.clone().sub(controls.target), z0 = camera.zoom, dist = Math.hypot(x - a.x, z - a.z);
  fly = now => { const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.set(a.x + (x - a.x) * e, 0, a.z + (z - a.z) * e); camera.position.copy(controls.target).add(off);
    camera.zoom = (z0 + (zoom - z0) * e) * (1 - Math.sin(k * Math.PI) * Math.min(.6, dist / 900)); camera.updateProjectionMatrix();
    if (k >= 1) fly = null; };
}
$("zin").onclick = () => setZoom(camera.zoom * 1.6);
$("zout").onclick = () => setZoom(camera.zoom / 1.6);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; fly = null; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 7 || performance.now() - down.t > 600) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(S.picks, false)[0];
  if (!hit) { if (S.sel) { S.sel = null; mark(S.mine); } return; }
  const d = hit.object.userData;
  if (d.type === "house") { const h = d.items[hit.instanceId]; S.sel = h; mark(h); showHouse(h); }
  else if (d.type === "work") showWork(d.w);
  else if (d.type === "gov") openGov(d.id);
  else if (d.type === "place") openPlace(d.id);
  else if (d.type === "slot") showSlot(d.slot);
});

/* ============================ LOOP ============================ */
const clock = new THREE.Clock(); let lastZoom = -1, lastTimeTick = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  if (fly) fly(now); else controls.update();
  const tg = controls.target, lim = (v, m) => Math.max(-m, Math.min(m, v)), cx = lim(tg.x, RX0 * S.s * 1.05), cz = lim(tg.z, RZ0 * S.s * 1.05);
  if (cx !== tg.x || cz !== tg.z) { camera.position.x += cx - tg.x; camera.position.z += cz - tg.z; tg.x = cx; tg.z = cz; }
  if (now - lastTimeTick > 20000) { lastTimeTick = now; if (timeMode.live) applyTime(); }
  if (trafficMesh && traffic.length) {
    const twin = trafficMesh.userData.twin;
    traffic.forEach((c, i) => { const L = c.x1 - c.x0; c.p = (c.p + c.v * dt * c.dir + L) % L; o3.position.set(c.x0 + c.p, .3, c.z); o3.rotation.set(0, c.dir * Math.PI / 2, 0); o3.scale.set(1, 1, 1); o3.updateMatrix(); trafficMesh.setMatrixAt(i, o3.matrix); if (twin) twin.setMatrixAt(i, o3.matrix); });
    trafficMesh.instanceMatrix.needsUpdate = true; if (twin) twin.instanceMatrix.needsUpdate = true;
  }
  boats.forEach((b, i) => { b.position.y = -2.9 + Math.sin(t * 1.3 + i) * .25; b.rotation.z = Math.sin(t * .9 + i * 2) * .04; });
  for (const f of FLAGS) { const p = f.geometry.attributes.position, base = f.userData.base, w = f.userData.w;
    for (let i = 0; i < p.count; i++) { const x = base[i * 3] + w / 2; p.array[i * 3 + 2] = Math.sin(x * 4.5 / w - t * 4) * x * .06; } p.needsUpdate = true; }
  if (ring.visible) ring.scale.setScalar(1 + Math.sin(t * 4) * .08);
  const vis = camera.right * 2 / camera.zoom, half = Math.min(500, Math.max(40, vis * .7)), sc = sun.shadow.camera;
  sun.position.copy(tg).addScaledVector(SUN_DIR, 600); sun.target.position.copy(tg);
  if (sc.right !== half) { sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = 1500; sc.updateProjectionMatrix(); }
  if (camera.zoom !== lastZoom) { lastZoom = camera.zoom; for (const l of LABELS) l.visible = lastZoom >= l.userData.minZ; }
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}

function progress() {
  const openAts = S.cities.map(c => c.opens_at), nxt = MILESTONES.find(a => !openAts.includes(a)); if (nxt == null) return "";
  const base = Math.max(0, ...openAts.filter(a => a <= S.total)), pct = Math.max(3, Math.min(100, (S.total - base) / (nxt - base) * 100));
  return `<div class="bar"><i style="width:${pct}%"></i></div><div class="barl"><span>${fmtN(S.total)}</span><span>עיר חדשה ב־${fmtN(nxt)}</span></div>`;
}
function showSlot(sl) {
  if (!sl.city) return open("שטח עתידי", `<div class="hero"><p>כאן תקום עיר חדשה כשהמדינה תגיע ל־<b>${fmtN(sl.at)}</b> תושבים. התושבים הראשונים שלה יבחרו לה שם.</p>${progress()}</div>`);
  const c = sl.city, ws = S.workplaces.filter(w => w.city_id === c.id);
  open(c.name, `<div class="stats"><div class="stat"><b>${fmtN(sl.pop)}</b><small>תושבים</small></div><div class="stat"><b>${fmtN(ws.length)}</b><small>עסקים</small></div><div class="stat"><b>${sl.at === 0 ? "בירה" : fmtN(sl.at)}</b><small>${sl.at === 0 ? "מעמד" : "נוסדה בתושב"}</small></div></div>
    <div class="list" style="margin-top:10px">${c.founder_username ? info("🏅", `‎@${esc(c.founder_username)}`, "נתנ/ה לעיר את השם") : info("🗳️", "השם עוד ייבחר", "התושבים יבחרו בתגובות לריל")}${S.mine?.city.id === c.id ? info("📍", "זו העיר שלך") : ""}</div>
    ${ws.length ? `<div class="sec">מקומות עבודה</div><div class="list">${ws.map(w => li("work", KIND_IC[w.kind] || "💼", esc(w.name), `${fmtN(w.staff.length)} עובדים`, w.id)).join("")}</div>` : ""}`);
}
function showWork(w) {
  const staff = [...w.staff].sort((a, b) => b.level - a.level || a.id - b.id), boss = staff[0];
  open(`${KIND_IC[w.kind] || "💼"} ${w.name}`, `<div class="stats"><div class="stat"><b>${fmtN(staff.length)}</b><small>עובדים</small></div><div class="stat"><b>${staff.filter(h => h.level > 1).length}</b><small>בניהול</small></div><div class="stat"><b style="font-size:15px">${esc(cityName(w.city_id))}</b><small>עיר</small></div></div>
    <div class="list" style="margin-top:10px">${boss && boss.level > 1 ? person(boss, LEVEL[Math.min(4, boss.level)]) : info("👔", "אין עדיין הנהלה", "הקידום הבא בהגרלה יכול להגיע מכאן")}</div>
    ${staff.length ? `<div class="sec">הצוות</div><div class="list">${staff.slice(0, 40).map(h => person(h, h.level > 1 ? LEVEL[Math.min(4, h.level)] : ROLE[w.kind] || "")).join("")}</div>` : ""}`);
}
function showHouse(h) {
  const me = S.mine === h, mins = S.gov.filter(m => m.citizens?.ig_username === h.u), wins = S.draws.filter(d => d.citizens?.ig_username === h.u);
  open(me ? "הבית שלך" : `‎@${h.u}`, `
    <div class="hero"><p style="font-size:13px">כתובת</p><div style="font-size:20px;font-weight:800;margin-top:2px">${esc(addressOf(h))}</div><p style="font-size:13px;margin-top:4px">תושב/ת #${fmtN(h.id)}</p></div>
    <div class="list" style="margin-top:10px">
      ${info(h.tier === 3 ? "🏡" : "🏠", HOUSE_NAMES[`${h.tier}_${h.style}`], h.tier === 3 ? "זכייה בהגרלה ✨" : h.tier === 2 ? "בית משודרג" : "בית התחלתי")}
      ${info(h.car === 3 ? "🏎️" : "🚗", CAR_NAMES[h.car], "חונה ליד הבית")}
      ${h.wp ? li("work", KIND_IC[h.wp.kind] || "💼", esc(jobTitle(h)), esc(cityName(h.wp.city_id)), h.wp.id) : info("💼", "מחפש/ת עבודה")}
      ${mins.map(m => info("🏛️", esc(m.ministry), `מונה ב־${fmtDate(m.appointed_at)}`)).join("")}
      ${wins.length ? info("🎟️", "זכה/תה בהגרלה", wins.map(d => (PRIZES[d.prize] || ["", d.prize])[1]).join(", ")) : ""}
    </div>
    <div class="btns"><button class="btn" data-go="id" data-arg="${esc(h.u)}">🪪 תעודת זהות</button>${me ? "" : `<button class="btn ghost" id="itsMe">זה אני</button>`}</div>`,
    () => { const b = $("itsMe"); if (b) b.onclick = () => { S.mine = h; S.sel = null; mark(h); history.replaceState(null, "", `?u=${encodeURIComponent(h.u)}`); showHouse(h); }; });
}
async function idCard(u) {
  const h = S.byUser.get(u); let row = null;
  try { row = (await api(`citizens?select=id,ig_username,created_at&ig_username=eq.${encodeURIComponent(u)}`))[0]; } catch {}
  if (!row || !h) return toast("לא הצלחנו לטעון את התעודה");
  open("תעודת זהות", `<div class="idc"><div class="idc-chip"></div><div class="idc-top">${FLAG}<div><b>רפובליקת סבבה</b><small>IDENTITY CARD · תעודת זהות</small></div></div>
      <div class="idc-num">${pad(row.id).replace(/(\d{3})(\d{3})/, "$1 $2")}</div>
      <div class="idc-grid"><div><small>שם משתמש</small><span dir="ltr" style="text-align:right">@${esc(row.ig_username)}</span></div><div><small>תאריך התאזרחות</small><span>${fmtDate(row.created_at)}</span></div>
      <div class="wide"><small>כתובת</small><span>${esc(addressOf(h))}</span></div><div class="wide"><small>עיסוק</small><span>${esc(jobTitle(h))}</span></div></div></div>
    <div class="btns"><button class="btn" id="dl">📲 תמונה לסטורי</button><button class="btn ghost" id="cp">🔗 העתק קישור</button></div>`,
    () => { $("dl").onclick = () => story(row, h); $("cp").onclick = async () => { try { await navigator.clipboard.writeText(`${location.origin}/?u=${encodeURIComponent(row.ig_username)}`); toast("הקישור הועתק"); } catch {} }; }, true);
}

/* ============================ SEARCH ============================ */
function find(qs) {
  const q = qs.trim(); if (!q) return; $("q").blur(); close();
  const byName = S.byUser.get(clean(q));
  let h = byName;
  if (!h) { const lq = q.toLowerCase().replace(/,.*$/, "").trim(); h = S.byAddr.get(lq) || [...S.byAddr.entries()].find(([k]) => k.startsWith(lq))?.[1]; }
  if (!h) return open("לא נמצא", `<div class="hero"><p>אין עדיין בית ל־<b dir="ltr">${esc(q)}</b> במדינה.</p></div><div class="list" style="margin-top:8px">${li("how", "🛂", "איך מתאזרחים?", "ולמה הבית עוד לא מופיע")}</div>`);
  if (byName) { S.mine = h; S.sel = null; history.replaceState(null, "", `?u=${encodeURIComponent(h.u)}`); } else S.sel = h;
  mark(h); flyTo(h.x, h.z, 7, 1600); setTimeout(() => showHouse(h), 1650);
}
$("findForm").onsubmit = e => { e.preventDefault(); find($("q").value); };

/* ============================ STORY IMAGE ============================ */
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
async function story(c, h) {
  await document.fonts.ready;
  const W = 1080, H = 1920, el = document.createElement("canvas"); el.width = W; el.height = H; const x = el.getContext("2d");
  const sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#1b2a4a"); sky.addColorStop(.55, "#e58a5c"); sky.addColorStop(1, "#f4c27d"); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  try { const f = await loadImg(FLAG_URI); x.save(); x.shadowColor = "rgba(0,0,0,.35)"; x.shadowBlur = 40; x.drawImage(f, W / 2 - 120, 150, 240, 160); x.restore(); } catch {}
  x.direction = "rtl"; x.textAlign = "center"; x.fillStyle = "#fff"; x.font = "300 84px Heebo"; x.fillText("רפובליקת סבבה", W / 2, 430);
  const cx = 90, cy = 520, cw = W - 180, ch = 560;
  x.save(); x.shadowColor = "rgba(20,30,70,.45)"; x.shadowBlur = 60; x.shadowOffsetY = 20;
  const g = x.createLinearGradient(cx, cy, cx + cw, cy + ch); g.addColorStop(0, "#0f8b8d"); g.addColorStop(.6, "#1d4e89"); g.addColorStop(1, "#2a2d6e"); x.fillStyle = g; rr(x, cx, cy, cw, ch, 44); x.fill(); x.restore();
  x.fillStyle = "rgba(255,255,255,.95)"; x.textAlign = "right";
  x.font = "800 44px Heebo"; x.fillText("רפובליקת סבבה", cx + cw - 50, cy + 90); x.font = "400 24px Heebo"; x.globalAlpha = .7; x.fillText("IDENTITY CARD · תעודת זהות", cx + cw - 50, cy + 130); x.globalAlpha = 1;
  const gold = x.createLinearGradient(cx + 50, cy + 50, cx + 130, cy + 110); gold.addColorStop(0, "#f6d27a"); gold.addColorStop(1, "#c99a3d"); x.fillStyle = gold; rr(x, cx + 50, cy + 52, 84, 62, 12); x.fill();
  x.fillStyle = "#fff"; x.font = "800 64px Heebo"; x.direction = "ltr"; x.textAlign = "right"; x.fillText(pad(c.id).replace(/(\d{3})(\d{3})/, "$1 $2"), cx + cw - 50, cy + 250);
  x.direction = "rtl"; const fld = (k, v, X, Y, sz = 38) => { x.globalAlpha = .7; x.font = "400 24px Heebo"; x.fillText(k, X, Y); x.globalAlpha = 1; x.font = `700 ${sz}px Heebo`; x.fillText(v, X, Y + sz + 6, cw - 100); };
  fld("שם משתמש", "@" + c.ig_username, cx + cw - 50, cy + 310); fld("כתובת", addressOf(h), cx + cw - 50, cy + 410, 34);
  x.textAlign = "center"; x.fillStyle = "#fff"; x.font = "400 34px Heebo"; x.fillText(jobTitle(h), W / 2, 1210, W - 160);
  x.font = "800 52px Heebo"; x.fillText("גם לך מחכה בית על האי", W / 2, 1640); x.font = "700 64px Heebo"; x.fillText("@" + INSTAGRAM, W / 2, 1740);
  el.toBlob(async blob => { const file = new File([blob], `sababa-${c.ig_username}.png`, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch {} }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }, "image/png");
}

/* ============================ DATA ============================ */
async function fetchCitizens() {
  const out = [], step = 1000; let cols = "id,ig_username,city_id,house_tier,car_tier,workplace_id,job_level";
  for (let from = 0; ; from += step) {
    let data;
    try { data = await api(`citizens?select=${cols}&order=id`, { Range: `${from}-${from + step - 1}` }); }
    catch (e) { if (e.message === "416") break; if (cols.includes("house_tier")) { cols = "id,ig_username,city_id"; from -= step; continue; } throw e; }
    out.push(...data); if (data.length < step) break;
  }
  return out;
}
async function loadData() {
  const [cities, citizens, workplaces] = await Promise.all([api("cities?select=id,name,opens_at,founder_username&order=opens_at"), fetchCitizens(), api("workplaces?select=id,name,kind,city_id&order=id").catch(() => [])]);
  S.cities = cities; S.raw = citizens; S.total = citizens.length; S.maxId = citizens.reduce((m, c) => Math.max(m, c.id), 0);
  S.workplaces = workplaces; S.wpById = new Map(workplaces.map(w => [w.id, w]));
  const slots = SLOTS.map(s => ({ ...s, city: cities.find(c => c.opens_at === s.at) || null }));
  for (const c of cities) if (!slots.some(s => s.city === c)) { const f = slots.find(s => !s.city); if (f) f.city = c; }
  S.slots = slots;
}
function loadExtras() {
  return Promise.all([
    api("laws?select=title,description,enacted_at&order=enacted_at.desc,id.desc").then(d => S.laws = d),
    api("ministers?select=ministry,appointed_at,citizens(ig_username)&order=appointed_at.desc,id.desc").then(d => S.gov = d),
    api("draws?select=id,draw_date,prize,details,citizens(ig_username)&order=id.desc&limit=60").then(d => S.draws = d)].map(p => p.catch(() => {})));
}
// live updates: once a minute, look for new citizens or a new draw and rebuild the island in place
async function refresh() {
  if (document.hidden || document.body.classList.contains("open")) return;
  try {
    const [top, dr] = await Promise.all([api("citizens?select=id&order=id.desc&limit=1"), api("draws?select=id&order=id.desc&limit=1").catch(() => [])]);
    const maxId = top[0]?.id || 0, drawId = dr[0]?.id || 0;
    if (maxId === S.maxId && drawId === (S.draws[0]?.id || 0)) return;
    const before = S.total;
    await loadData(); await loadExtras(); buildWorld();
    const n = S.total - before; toast(n > 0 ? `👋 ${fmtN(n)} תושבים חדשים הגיעו לאי` : "🎟️ יש זוכים חדשים בהגרלה");
  } catch {}
}

/* ============================ BOOT ============================ */
async function boot() {
  const day = Math.max(1, Math.floor((Date.now() - new Date(INDEPENDENCE_DAY + "T00:00:00").getTime()) / 864e5) + 1);
  $("hudDay").textContent = "יום " + fmtN(day);
  applyTime();
  try { await loadData(); } catch (e) { console.error(e); toast("לא הצלחנו לטעון את המדינה. נסו לרענן."); S.raw = []; S.slots = SLOTS.map(s => ({ ...s, city: null })); }
  $("loadMsg").textContent = "מחלקים מפתחות לבתים…"; await new Promise(r => setTimeout(r, 30));
  await loadExtras();
  buildWorld(); applyTime();
  const cap = S.slots[0];
  controls.target.set(0, 0, 0); camera.position.copy(VIEW_DIR).multiplyScalar(2000); setZoom(fitZoom());
  requestAnimationFrame(loop);
  setTimeout(() => { $("loader").classList.add("gone"); flyTo(cap.x, cap.z, 2.2, 2400); }, 500);
  const pre = new URLSearchParams(location.search).get("u");
  if (pre) { $("q").value = "@" + clean(pre); setTimeout(() => find(pre), 3000); }
  setInterval(refresh, REFRESH_MS);
}
boot();
</script>
