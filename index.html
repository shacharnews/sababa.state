<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>רפובליקת סבבה</title>
<meta name="description" content="כל עוקב הוא אזרח עם בית, רכב, עבודה וכתובת. מצאו את הבית שלכם ברפובליקת סבבה.">
<meta name="theme-color" content="#0e1726">
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:rgba(255,255,255,.78); --bg-strong:rgba(255,255,255,.94); --fg:#0f172a; --fg2:#5b6475; --hair:rgba(15,23,42,.08);
  --accent:#0f8b8d; --accent-2:#e07a4f; --tint:rgba(15,139,141,.1); --shadow:0 10px 30px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.06);
}
body.night{ --bg:rgba(16,22,36,.72); --bg-strong:rgba(18,25,41,.94); --fg:#eef2fb; --fg2:#9aa6bd; --hair:rgba(255,255,255,.09);
  --accent:#f5b759; --accent-2:#ff8a65; --tint:rgba(245,183,89,.14); --shadow:0 10px 30px rgba(0,0,0,.45) }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Heebo,system-ui,sans-serif;color:var(--fg);background:#0e1726}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.glass{background:var(--bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);transition:background .6s,color .6s}
#gl{position:fixed;inset:0;touch-action:none}
#gl canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#labels *{pointer-events:none}
/* the label layer must be LTR: in an RTL page, absolutely positioned labels are measured from the right edge, which pushed every label sideways */
#labels{direction:ltr}
#labels>div{left:0;top:0}
.lbl,.marker{direction:rtl}

/* ---------- map labels ---------- */
.lbl{font-family:Heebo,sans-serif;white-space:nowrap;text-align:center;color:var(--fg);transition:color .6s}
.lbl.city{background:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:5px 14px 6px;box-shadow:var(--shadow);font-weight:800;font-size:16px;letter-spacing:-.2px;line-height:1.15}
.lbl.city small{display:block;font-size:11px;font-weight:500;color:var(--fg2)}
.lbl.tag{background:var(--bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl.tag.gov{background:var(--accent);color:#fff}
body.night .lbl.tag.gov{color:#1b1406}
.lbl.lock{font-size:11px;font-weight:500;color:#fff;background:rgba(15,23,42,.45);border-radius:999px;padding:2px 9px}
.marker{display:flex;flex-direction:column;align-items:center}
.marker .bub{background:var(--accent-2);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:5px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.marker .stem{width:3px;height:16px;background:var(--accent-2);border-radius:2px}
.marker .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 5px rgba(224,122,79,.3)}
.marker.alt .bub,.marker.alt .stem,.marker.alt .dot{background:var(--accent)}

/* ---------- top bar ---------- */
.top{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:10px;left:10px;display:flex;justify-content:space-between;align-items:center;border-radius:20px;padding:8px 10px 8px 8px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-align:right}
.brand svg{width:40px;height:auto;border-radius:6px;display:block;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--fg2);font-weight:500}
.clock{display:flex;align-items:center;gap:6px;background:var(--tint);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.clock small{font-weight:500;color:var(--fg2);font-size:12px}
.zoom{position:fixed;z-index:3;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.zoom button{width:44px;height:44px;font-size:20px;font-weight:500;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--hair)}

/* ---------- dock ---------- */
.dock{position:fixed;z-index:3;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:24px;padding:10px;max-width:640px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:16px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;font-weight:500;color:var(--fg);padding:11px 0}
.search input::placeholder{color:var(--fg2)}
.search button{color:var(--accent);font-weight:800;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px}
.tabs button{position:relative}.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:2px;left:calc(50% - 20px);background:#e5484d;color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:21px;border-radius:12px}
.tabs button span{font-size:11.5px;font-weight:600;color:var(--fg2)}
.tabs button:active{background:var(--tint)}
.toast{position:fixed;z-index:6;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:.3s;border-radius:16px;padding:10px 16px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(5,10,20,.25);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer{position:fixed;z-index:10;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:84vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--bg-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.9,.25,1),background .6s}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.grab{width:40px;height:5px;border-radius:3px;margin:8px auto 0;background:rgba(127,127,127,.35)}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 18px 10px}
.dhead h2{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.dhead button{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:16px;color:var(--fg2)}
.dhead button[hidden]{display:none}
.dbody{overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.sec{font-size:13px;font-weight:700;color:var(--fg2);margin:18px 4px 8px;letter-spacing:.2px}
.list{background:var(--tint);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;text-decoration:none}
.li+.li{border-top:1px solid var(--hair)}
button.li:active{background:var(--hair)}
.li .ic{width:38px;height:38px;border-radius:11px;background:var(--bg-strong);display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-weight:700;font-size:15.5px}
.li small{display:block;color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{color:var(--fg2);font-size:18px}
.hero{border-radius:20px;padding:16px;background:var(--tint);margin-top:4px}
.hero p{margin:0;color:var(--fg2);line-height:1.55}
.hero b{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:var(--tint);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{color:var(--fg2);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none}
body.night .btn{color:#1b1406}
.btn.ghost{background:var(--tint);color:var(--fg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.bar{height:8px;border-radius:999px;background:var(--hair);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.barl{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:5px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- id card ---------- */
.idc{position:relative;border-radius:22px;padding:18px;color:#fff;overflow:hidden;aspect-ratio:1.586;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(135deg,#0f8b8d 0%,#1d4e89 60%,#2a2d6e 100%);box-shadow:0 18px 40px rgba(29,78,137,.35)}
.idc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.idc-top{display:flex;align-items:center;gap:10px}
.idc-top svg{width:44px;height:auto;border-radius:5px}
.idc-top b{display:block;font-size:16px;font-weight:800}
.idc-top small{display:block;font-size:10px;letter-spacing:1.5px;opacity:.75}
.idc-chip{position:absolute;left:18px;top:20px;width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f6d27a,#c99a3d)}
.idc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:auto;position:relative;z-index:1}
.idc-grid div{min-width:0}
.idc-grid small{display:block;font-size:10px;opacity:.7;letter-spacing:.3px}
.idc-grid span{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idc-grid .wide{grid-column:1/-1}
.idc-num{font-size:24px;font-weight:800;letter-spacing:2px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;margin-top:12px;position:relative;z-index:1}

/* ---------- reel studio ---------- */
body.rec .top,body.rec .zoom,body.rec .dock,body.rec #labels,body.rec .toast{display:none}
body.rec #gl{display:grid;place-items:center;background:#000}
#recBar{position:fixed;z-index:15;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;font-weight:700;font-size:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body.rec #recBar{display:flex}
#recBar i{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:blink 1s infinite}
#recBar button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700}
@keyframes blink{50%{opacity:.2}}
.reelvid{width:100%;max-height:56vh;border-radius:18px;background:#000;display:block}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{background:var(--tint);border-radius:18px;padding:14px 12px;text-align:right}
.tpl button b{display:block;font-size:15px;margin-top:6px}.tpl button small{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.tpl button span{font-size:26px}
.tpl button:disabled,.tpl button.off{opacity:.45}
.ballot{background:var(--tint);border-radius:18px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ballot.closed{opacity:.9}.bhead{display:flex;gap:10px;align-items:center}.bhead span{font-size:26px}.bhead b{display:block;font-size:16px}.bhead small{color:var(--fg2);font-size:12.5px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg-strong);border-radius:14px;padding:12px 14px;text-align:right;min-height:50px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.opt i{position:absolute;inset:0 0 0 auto;background:var(--tint);border-radius:14px;transition:width .5s}
.opt .ol,.opt .op{position:relative;font-weight:700}.opt .ol small{display:block;font-weight:500;color:var(--fg2);font-size:11.5px}.opt .op{font-variant-numeric:tabular-nums;color:var(--fg2)}
.opt.mine{box-shadow:inset 0 0 0 2px var(--accent)}.opt.win{box-shadow:inset 0 0 0 2px #e2b33a}.opt:disabled{cursor:default}
details.adm{background:var(--tint);border-radius:18px;padding:4px 12px;margin-top:10px}details.adm[open]{padding-bottom:12px}
details.adm summary{font-weight:800;font-size:15.5px;padding:10px 0;cursor:pointer}
details.adm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--fg2);margin-top:8px}
details.adm input,details.adm select,details.adm textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:8px 10px}
details.adm input[type=color]{height:42px;padding:2px}details.adm .btn{width:100%;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--bg-strong);border-radius:10px;padding:6px 9px;font-size:12.5px;font-weight:700;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:var(--tint);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px}
.scene{background:var(--tint);border-radius:18px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;align-items:center;justify-content:space-between}.shead b{font-size:15px}
.shead span{display:flex;gap:4px}.shead button{width:32px;height:32px;border-radius:10px;background:var(--bg-strong)}.shead button:disabled{opacity:.3}
.scene label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--fg2)}
.scene select,.scene input{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:8px 10px}
.row3{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:6px}
.tpl .hero-tpl{grid-column:1/-1;background:linear-gradient(135deg,rgba(255,182,39,.25),var(--tint))}
.reelprev{height:min(100vh,177.8vw);width:auto;max-width:100vw;display:block}
body.rec #gl canvas:not(.reelprev){position:absolute;left:-99999px}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg-strong);border:1px solid var(--hair);border-radius:10px;padding:6px 8px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vrow{background:var(--tint);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.vrow.done{box-shadow:inset 0 0 0 2px rgba(15,139,141,.35)}
.vtx{flex:1;min-width:0}.vtx small{display:block;color:var(--fg2);font-size:11.5px}.vtx b{display:block;font-size:15px;line-height:1.35}
.vbtn{display:flex;align-items:center;gap:6px;flex:none}
.vbtn button{background:var(--bg-strong);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.vbtn button.rec{background:#e5484d;color:#fff}.vbtn button.rec.on{animation:blink 1s infinite}
.vbtn button:disabled{opacity:.4}.vdur{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--fg2);text-align:center;margin:8px 0 0}
.hero.warn{background:rgba(224,122,79,.16)}
code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;direction:ltr;unicode-bidi:embed;white-space:normal}
.li small code{white-space:normal}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-inline-start:4px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
/* ---------- wallet, shop, achievements ---------- */
.wallet{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}
.wallet div{background:var(--tint);border-radius:16px;padding:10px 8px;text-align:center}
.wallet small{display:block;color:var(--fg2);font-size:12px}.wallet b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.55}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ach button{background:var(--tint);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;filter:grayscale(1);opacity:.45}
.ach button.on{filter:none;opacity:1;background:linear-gradient(160deg,rgba(255,182,39,.28),var(--tint))}
.ach span{font-size:24px}.ach small{font-size:10.5px;font-weight:600;line-height:1.15;text-align:center}
.bar.sm{height:5px;margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--tint);border-radius:14px;padding:4px;margin-top:12px}
.seg button{border-radius:11px;padding:9px 0;font-weight:700;color:var(--fg2)}.seg button.on{background:var(--bg-strong);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatches button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swatches button.on{box-shadow:0 0 0 3px var(--bg-strong),0 0 0 5px var(--accent)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shop .item{background:var(--tint);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px}
.shop img{width:100%;aspect-ratio:1.6;object-fit:contain;border-radius:10px;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.7),transparent 70%)}
.shop b{font-size:14.5px}.shop small{color:var(--fg2);font-size:12px;margin-bottom:6px}
.shop .btn{padding:8px 6px;font-size:13px;margin-top:auto}.shop .btn.sure{background:var(--accent-2)}
.own,.need{margin-top:auto;text-align:center;font-size:12.5px;font-weight:700;padding:8px 0;color:var(--fg2)}.own{color:var(--accent)}
.storybox{background:var(--tint);border-radius:18px;padding:10px;display:grid;place-items:center;min-height:120px}
.storybox img{width:min(60%,260px);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);-webkit-touch-callout:default;user-select:auto}
.stwait{color:var(--fg2);font-weight:600}
a.btn[aria-disabled]{opacity:.55;pointer-events:none}
body.inside .top,body.inside .zoom,body.inside .dock,body.inside #labels{display:none}
#intUI{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
body.inside #intUI{display:block}
#intUI>*{pointer-events:auto}
.ihead{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;max-width:640px;margin:0 auto;border-radius:20px;display:flex;align-items:center;gap:10px;padding:10px 12px}
.ihead .ic{font-size:26px}.ihead .tx{flex:1}.ihead b{display:block;font-size:17px;font-weight:800}.ihead small{color:var(--fg2);font-size:12.5px}
.ihead button{width:36px;height:36px;border-radius:50%;background:var(--tint);font-size:16px}
.ifoot{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:640px;margin:0 auto;border-radius:22px;padding:12px 14px;text-align:center}
.ifoot p{margin:0 0 10px;font-size:14.5px;color:var(--fg2)}.ifoot p b{color:var(--fg)}.ifoot .btn{width:100%}.ifoot .note{margin:8px 0 0}
/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(180deg,#1b2a4a 0%,#e58a5c 62%,#f4c27d 100%);transition:opacity .8s}
#loader.gone{opacity:0;pointer-events:none}
#loader .in{text-align:center;color:#fff}
#loader svg{width:120px;height:auto;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:float 3s ease-in-out infinite}
#loader h1{font-size:30px;font-weight:300;letter-spacing:-.5px;margin:22px 0 4px}
#loader h1 b{font-weight:800}

function part(geo, color, x = 0, y = 0, z = 0, r = {}) {
  if (geo.index) geo = geo.toNonIndexed();
  if (r.x) geo.rotateX(r.x); if (r.z) geo.rotateZ(r.z); if (r.y) geo.rotateY(r.y);
  geo.translate(x, y, z);
  const kind = { "*": "glow", "^": "red", "!": "paint", "~": "tint" }[color[0]] || "base", c = C(kind === "base" ? color : color.slice(1)), n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  geo.setAttribute("color", new THREE.BufferAttribute(a, 3));
  for (const k of Object.keys(geo.attributes)) if (!["position", "normal", "color"].includes(k)) geo.deleteAttribute(k);
  geo.userData.kind = kind;
  return geo;
}
const box = (w, h, d, col, x = 0, y = 0, z = 0, r) => part(new THREE.BoxGeometry(w, h, d), col, x, y + h / 2, z, r);

function gable(w, h, d, col, x = 0, y = 0, z = 0) {
  const g = new THREE.ExtrudeGeometry(new THREE.Shape([new THREE.Vector2(-d / 2, 0), new THREE.Vector2(d / 2, 0), new THREE.Vector2(0, h)]), { depth: w, bevelEnabled: false });
  g.translate(0, 0, -w / 2); g.rotateY(Math.PI / 2); return part(g, col, x, y, z);
}

const BUCKETS = ["base", "glow", "red", "paint", "tint"];
function prefab(parts, shared = true) {
  const out = {};

  if (!out.base) out.base = mergeGeometries([box(.01, .01, .01, "#000000", 0, -50, 0)]);

}

function layout() {
  S.houses = []; S.byUser.clear(); S.byAddr.clear();
  const byCity = new Map();

  let need = growth(S.total);
  S.slots.forEach((slot, si) => {
    slot.blocks = new Map(); slot.pop = 0;
    if (!slot.city) return;
    const list = (byCity.get(slot.city.id) || []).sort((a, b) => a.id - b.id), lots = cityLots(slot, si, list.length);
    slot.pop = list.length;
    list.forEach((c, i) => {
      const lot = lots[i] || null, tier = Math.min(3, Math.max(1, c.house_tier || 1)), car = Math.min(3, Math.max(1, c.car_tier || 1)), u = c.ig_username;
      // the style/model the citizen bought, unless a draw moved them to another tier since then
      const hk = c.house_style && +c.house_style[0] === tier && P[c.house_style] ? c.house_style : `${tier}_${tier === 1 ? hash(u) % 3 : tier === 2 ? hash(u) % 2 : 0}`;
      const cm = c.car_model && CARS[c.car_model]?.tier === car ? c.car_model : CARS_BY_TIER[car][hash(u + "m") % CARS_BY_TIER[car].length];
      const ck = COLORS[c.car_color] ? c.car_color : COLOR_KEYS[hash(u + "car") % (car === 3 ? 10 : 9)];
      const h = { id: c.id, u, city: slot.city, slot, lot, tier, hk, painted: !!c.car_color, joined: c.created_at, car, cm, ck, cc: COLORS[ck][0], coins: c.coins, lastShift: c.last_shift, streak: c.streak || 0, best: c.best_streak || c.streak || 0, last: c.last_collected,
        wp: S.wpById.get(c.workplace_id) || null, level: c.job_level || 1, x: lot ? lot.x : slot.x, z: lot ? lot.z : slot.z };
      S.houses.push(h); S.byUser.set(h.u, h); if (lot) S.byAddr.set(`${lot.street} ${lot.num}`.toLowerCase(), h);
      if (lot) slot.blocks.set(`${lot.bx},${lot.bz}`, { bx: lot.bx, bz: lot.bz });
    });
    slot.blocks.set("0,0", { bx: 0, bz: 0, civic: "plaza" });
    slot.reserved = reservedBlocks(slot, si);
    for (const [bx, bz] of slot.reserved) {
      // an L-shaped street from the plaza: along the row, then up or down the column
      for (let x = Math.sign(bx); x !== bx + Math.sign(bx) && bx; x += Math.sign(bx)) if (!slot.blocks.has(`${x},0`)) slot.blocks.set(`${x},0`, { bx: x, bz: 0 });
      for (let z = Math.sign(bz); z !== bz && bz; z += Math.sign(bz)) if (!slot.blocks.has(`${bx},${z}`)) slot.blocks.set(`${bx},${z}`, { bx, bz: z });
    }
    // business-district blocks are paved only once the admin puts a building on them
    const nW = S.workplaces.filter(w => w.city_id === slot.city.id).length;
    slot.extraUsed = extraBlocks(slot, si).slice(0, Math.max(0, nW - N_WORK));
    for (const [bx, bz] of slot.extraUsed) {
      for (let x = Math.sign(bx); x !== bx + Math.sign(bx) && bx; x += Math.sign(bx)) if (!slot.blocks.has(`${x},0`)) slot.blocks.set(`${x},0`, { bx: x, bz: 0 });
      for (let z = Math.sign(bz); z !== bz && bz; z += Math.sign(bz)) if (!slot.blocks.has(`${bx},${z}`)) slot.blocks.set(`${bx},${z}`, { bx, bz: z });
    }
    for (const [bx, bz] of [...slot.reserved, ...slot.extraUsed]) slot.blocks.set(`${bx},${bz}`, { bx, bz, civic: "work" });
    // the island must cover every block of this city
    for (const b of slot.blocks.values()) for (const [dx, dz] of [[-26, -16], [26, -16], [-26, 16], [26, 16]]) {
      const x = slot.x + b.bx * BX + dx, z = slot.z + b.bz * BZ + dz, t = Math.atan2(z / RZ0, x / RX0), d = Math.hypot(x / RX0, z / RZ0);

  // citizen number = order of arrival (ids can have gaps)
  [...S.houses].sort((a, b) => a.id - b.id).forEach((h, i) => h.no = i + 1);
  for (const w of S.workplaces) w.staff = [];
  for (const h of S.houses) if (h.wp) h.wp.staff.push(h);
}

function buildCities() {
  const open = S.slots.filter(s => s.city), asphalt = [], walk = [], curbs = [], lawn = [], dashes = [], hedges = [], lamps = new Map();
  walkers = [];
  for (const slot of open) {
    const taken = new Set(S.houses.filter(h => h.slot === slot && h.lot).map(h => `${h.lot.x},${h.lot.z}`));
    for (const b of slot.blocks.values()) {

        for (let j = 0; j < 2; j++) for (let i = 0; i < 4; i++) {

      for (const [dx, dz] of [[-20.6, -10.6], [20.6, 10.6]]) lamps.set(`${cx + dx},${cz + dz}`, { x: cx + dx, z: cz + dz, r: dx < 0 ? 0 : Math.PI });

  instanced(P.slab, hedges, ([x, z, w, h, d], o) => { o.position.set(x, LAWN, z); o.scale.set(w, h, d); return "#4d7d3b"; });

    const segs = ends.map(t => [cap.x, cap.z, t.x, t.z]);

    const hd = []; for (const [a, b, c, d] of segs) { const L = Math.hypot(c - a, d - b); for (let k = 20; k < L - 10; k += 14) hd.push([a + (c - a) * k / L, b + (d - b) * k / L, Math.atan2(c - a, d - b)]); }

  }

  // houses

  for (const [key, list] of Object.entries(groups)) {
    const m = instanced(P[key], list, (h, o) => { o.position.set(h.x, LAWN, h.z); o.rotation.y = h.lot.face; return BODY_TINTS[hash(h.u + "w") % BODY_TINTS.length]; });

  instanced(P.olive, S.houses.filter(h => h.lot && h.tier < 3 && hash(h.u + "t") % 3 === 0), (h, o) => { const [x, z] = back(h, 3.6); o.position.set(x, LAWN, z); o.scale.setScalar(.75 + (hash(h.u) % 4) / 10); o.rotation.y = h.id; });

addEventListener("keydown", e => { if (e.key === "Escape") close(); });
const li = (go, ic, t, sub = "", arg = "") => `<button class="li" data-go="${go}" data-arg="${esc(arg)}"><span class="ic">${ic}</span><span class="tx"><b>${t}</b>${sub ? `<small>${sub}</small>` : ""}</span><span class="chev">‹</span></button>`;
const info = (ic, t, sub = "") => `<div class="li"><span class="ic">${ic}</span><span class="tx"><b>${t}</b>${sub ? `<small>${sub}</small>` : ""}</span></div>`;
const person = (h, sub) => li("house", h.tier === 3 ? "🏡" : "🏠", `<span dir="ltr">@${esc(h.u)}</span>`, sub, h.u);
const goTo = (x, z, zoom, then) => { close(); flyTo(x, z, zoom); if (then) setTimeout(then, 1250); };
const cityName = id => S.cities.find(c => c.id === id)?.name || "";
const sub = () => stack.length > 0;

    <div class="hero" style="margin-top:8px"><p><b>האי גדל יחד איתכם.</b> כל תושב חדש מוסיף שטח למדינה, ובכל מיילסטון קמה עיר חדשה.</p>${progress()}</div>

    <div class="sec">מקומות</div><div class="list">${COAST.map(c => li("place", c.ic, c.name, "", c.id)).join("")}</div>
    <div class="btns"><a class="btn" href="https://instagram.com/${INSTAGRAM}" target="_blank" rel="noopener">📸 ‎@${INSTAGRAM}</a></div>`),
  mine: () => { if (S.mine) { S.sel = null; mark(S.mine); goTo(S.mine.x, S.mine.z, 7, () => showHouse(S.mine)); } else { $("q").focus(); toast("הקלידו את שם המשתמש שלכם באינסטגרם"); } },
  how: () => open("איך מתאזרחים?", `
    <div class="list">${info("1️⃣", `עוקבים אחרי ‎@${INSTAGRAM}`, "באינסטגרם")}${info("2️⃣", "שולחים את המילה ״אזרחות״", "בהודעה פרטית או בתגובה לריל")}${info("3️⃣", "מקבלים בית, רכב ועבודה", "עם כתובת קבועה באחת הערים")}</div>
    <div class="hero" style="margin-top:12px"><p><b>מתחילים צנוע, משדרגים בדרך.</b> כל יום עבודה מכניס משכורת בסבבונים ${COIN}, ואיתם קונים רכב חדש בצבע שבוחרים או משדרגים את הבית. וכל יום מוגרלים וילה, רכב יוקרה, קידום, מענק כספי ומינוי לשר.</p></div>
    <div class="hero" style="margin-top:8px"><p><b>הבית עוד לא מופיע?</b> משרד הפנים מאשר בקשות פעם-פעמיים ביום. עברו יותר מ־24 שעות? ודאו שאתם עוקבים ושלחו שוב.</p></div>

  draws: () => {
    const byDay = new Map(); for (const d of S.draws) { if (!byDay.has(d.draw_date)) byDay.set(d.draw_date, []); byDay.get(d.draw_date).push(d); }
    open("ההגרלה היומית", `<div class="hero"><p><b>כל יום, שישה פרסים בין כל התושבים.</b> הזוכים משודרגים על המפה מיד.</p></div>

      ${[...byDay.entries()].slice(0, 7).map(([day, list]) => `<div class="sec">${fmtDate(day)}</div><div class="list">${list.map(d => { const [ic, t] = PRIZES[d.prize] || ["🎁", d.prize], u = d.citizens?.ig_username || "";
        return li("house", ic, t, `‎@${esc(u)}${d.details ? " · " + esc(d.details) : ""}`, u); }).join("")}</div>`).join("") || `<div class="sec">זוכים</div><div class="hero"><p>ההגרלה הראשונה עוד לא נערכה. היא תתקיים בקרוב, בשידור בריל 🎬</p></div>`}`, null, sub());
  },
  jobs: () => open("עבודה במדינה", S.slots.filter(s => s.city).map(sl => `<div class="sec">${esc(sl.city.name)}</div><div class="list">${S.workplaces.filter(w => w.city_id === sl.city.id).map(w => li("work", KIND_IC[w.kind] || "💼", esc(w.name), `${fmtN(w.staff.length)} עובדים`, w.id)).join("") || info("⏳", "עוד אין מקומות עבודה")}</div>`).join("") || `<div class="hero"><p>טוען…</p></div>`, null, sub()),

  slot: i => { const sl = S.slots[+i]; if (!sl.city && !onGrass(sl.x, sl.z, S.s, .02)) return toast("השטח הזה עוד מתחת למים 🌊 האי יגיע אליו כשיהיו עוד תושבים"); goTo(sl.x, sl.z, sl.city ? 2.4 : 1.2, () => showSlot(sl)); },
  laws: () => open("ספר החוקים", S.laws.length ? `<div class="list">${S.laws.map((l, i) => info("📜", `חוק ${S.laws.length - i}: ${esc(l.title)}`, `${l.description ? esc(l.description) + " · " : ""}${fmtDate(l.enacted_at)}`)).join("")}</div>` : `<div class="hero"><p>ספר החוקים עדיין ריק. החוק הראשון ייקבע בתגובות לריל 👀</p></div>`, null, sub()),
  govlist: () => open("הממשלה", S.gov.length ? `<div class="list">${S.gov.map(m => { const h = S.byUser.get(m.citizens?.ig_username); return h ? person(h, `${esc(m.ministry)} · ${fmtDate(m.appointed_at)}`) : info("🏛️", esc(m.ministry)); }).join("")}</div>` : `<div class="hero"><p>עוד לא מונו שרים. כל יום מוגרל שר חדש מבין התושבים.</p></div>`, null, sub()),
  people: () => { const asc = [...S.houses].sort((a, b) => a.id - b.id);
    open("התושבים", `<div class="sec">הגיעו לאחרונה</div><div class="list">${asc.slice(-10).reverse().map(h => person(h, esc(addressOf(h)))).join("") || info("⏳", "עוד אין")}</div>
      <div class="sec">המייסדים</div><div class="list">${asc.slice(0, 10).map(h => person(h, `תושב/ת #${fmtN(h.id)}`)).join("") || info("⏳", "עוד אין")}</div>`, null, sub()); },
  house: u => { const h = S.byUser.get(u); if (!h) return toast("התושב/ת עוד לא על המפה"); S.sel = h; mark(h); goTo(h.x, h.z, 7, () => showHouse(h)); },
  time: () => open("השעה במדינה", `<div class="hero"><p>העיר מתעוררת ונרדמת לפי השעה האמיתית בישראל. אפשר לגלול כדי לראות אותה בכל שעה.</p>
      <input type="range" id="tr" min="0" max="23.9" step=".1" value="${(timeMode.live ? israelHour() : timeMode.h).toFixed(1)}" style="margin-top:14px"></div>
      <div class="btns"><button class="btn" id="tlive">⏱️ חזרה לזמן אמת</button></div>`,
    () => { $("tr").oninput = e => { timeMode = { live: false, h: +e.target.value }; applyTime(); }; $("tlive").onclick = () => { timeMode.live = true; applyTime(); close(); }; }, sub()),
  symbols: () => open("סמלי המדינה", `<div style="max-width:260px;margin:4px auto 14px">${FLAG.replace("<svg ", '<svg style="width:100%;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)" ')}</div>
      <div class="list">${info("🌊", "הכחול: הים", "מכל הכיוונים, וכל אחד יכול להפליג אלינו")}${info("🏝️", "החול: האי", "האדמה שגדלה עם כל תושב חדש")}${info("🌅", "השמש העולה", "מדינה שרק מתחילה")}${info("⭐", "הכוכב הלבן", "התושב. כל אחד מהעוקבים")}${info("🤙", "המוטו: ״יהיה בסדר״", "ממילא תמיד היה")}</div>`, null, sub()),
  gov: id => { const g = GOV.find(q => q.id === id); if (g.x == null) return; goTo(g.x, g.z, 4.5, () => openGov(id)); },
  place: id => { const c = COAST.find(q => q.id === id); if (c.x == null) return; goTo(c.x, c.z, 3, () => openPlace(id)); },
  id: u => idCard(u),
  ideas: () => {
    const row = p => li("project", PROJECT_KINDS[p.kind]?.[0] || "🏗️", esc(p.name || PROJECT_KINDS[p.kind]?.[1]), `${p.status === "done" ? "נחנך" : "בבנייה"} · ${esc(cityName(p.city_id))}${p.requested_by ? ` · בהצעת ‎@${esc(p.requested_by)}` : ""}`, p.id);
    const done = S.projects.filter(p => p.status === "done"), building = S.projects.filter(p => p.status !== "done");
    const free = S.slots.filter(s => s.city).reduce((n, s) => n + Math.max(0, (s.publicSpots?.length || 0) - S.projects.filter(p => p.city_id === s.city.id).length), 0);
    open("נבנה לפי בקשתכם", `<div class="hero"><p><b>אתם מחליטים מה נבנה במדינה.</b> כתבו בתגובות לריל מה חסר לכם: גינה, בריכה, מגרש, ספרייה… ההצעות הכי אהובות נבנות על המגרשים הציבוריים, ושם המציע/ה נכתב על הפרויקט.</p></div>
      <div class="stats" style="margin-top:8px"><div class="stat"><b>${fmtN(done.length)}</b><small>נחנכו</small></div><div class="stat"><b>${fmtN(building.length)}</b><small>בבנייה</small></div><div class="stat"><b>${fmtN(free)}</b><small>מגרשים פנויים</small></div></div>
      ${building.length ? `<div class="sec">בבנייה עכשיו</div><div class="list">${building.map(row).join("")}</div>` : ""}
      ${done.length ? `<div class="sec">נחנכו</div><div class="list">${done.slice().reverse().map(row).join("")}</div>` : ""}
      <div class="sec">מה אפשר לבנות</div><div class="list">${Object.values(PROJECT_KINDS).map(([ic, t]) => info(ic, t)).join("")}</div>
      <div class="btns"><a class="btn" href="https://instagram.com/${INSTAGRAM}" target="_blank" rel="noopener">💬 להציע בתגובות</a></div>`, null, sub());
  },
  project: id => { const p = S.projects.find(q => q.id === +id); if (!p) return; if (p.x != null) goTo(p.x, p.z, 4, () => showProject(p)); else showProject(p); }

function showProject(p) {
  const [ic, kindName] = PROJECT_KINDS[p.kind] || ["🏗️", ""], who = p.requested_by && S.byUser.get(p.requested_by);
  open(`${ic} ${p.name || kindName}`, `<div class="hero"><p>${p.status === "done" ? `<b>נחנך!</b> ${esc(kindName)} ב${esc(cityName(p.city_id))}, שנבנה בעקבות בקשה של התושבים.` : `<b>בבנייה.</b> העגורנים כבר כאן. ${esc(kindName)} ב${esc(cityName(p.city_id))} ייחנך בקרוב.`}</p></div>
    <div class="list" style="margin-top:10px">${p.requested_by ? (who ? person(who, "הציע/ה את הרעיון בתגובות") : info("💡", `‎@${esc(p.requested_by)}`, "הציע/ה את הרעיון בתגובות")) : info("🗳️", "רעיון של הקהילה")}
      ${info("📅", p.status === "done" ? "נחנך" : "התחילו לבנות", fmtDate(p.created_at))}</div>
    <div class="btns"><button class="btn ghost" data-go="ideas">כל הפרויקטים</button></div>`);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => GO[b.dataset.tab]());
$("brand").onclick = () => GO.state(); $("clock").onclick = () => GO.time();

  const g = GOV.find(q => q.id === id);
  open(`${g.ic} ${g.name}`, {
    knesset: `<div class="hero"><p>בית הנבחרים. כל התושבים מצביעים כאן, בתגובות לריל, על חוק היום.</p></div><div class="sec">פעולות</div><div class="list">${li("laws", "📜", "ספר החוקים", `${fmtN(S.laws.length)} חוקים`)}${li("govlist", "🏛️", "הממשלה", `${fmtN(S.gov.length)} שרים`)}</div>`,
    pm: `<div class="hero"><p>לשכת ראש הממשלה. מכאן יוצאות ההכרזות, ההגרלות היומיות וזכות הווטו על שמות ערים מוגזמים.</p></div><div class="sec">פעולות</div><div class="list">${li("draws", "🎟️", "ההגרלה היומית")}${li("cities", "🏙️", "הערים")}</div>`,
    interior: `<div class="hero"><p>כאן מנפיקים תעודות זהות, מאשרים התאזרחות ומחלקים כתובות.</p></div><div class="sec">פעולות</div><div class="list">${li("mine", "🪪", "התעודה שלי", "חיפוש לפי שם משתמש")}${li("how", "🛂", "איך מתאזרחים?")}</div>`
  }[id]);
}
function openPlace(id) {
  const c = COAST.find(q => q.id === id);
  open(`${c.ic} ${c.name}`, {
    harbor: `<div class="hero"><p>כל תושב חדש מגיע דרך הנמל. עד היום עגנו כאן <b>${fmtN(S.total)}</b> תושבים.</p></div><div class="list" style="margin-top:8px">${li("how", "⛵", "רוצים להצטרף?")}${li("people", "👋", "מי הגיע לאחרונה")}</div>`,
    light: `<div class="hero"><p>המגדלור מאיר את הדרך לכל מי שעוד לא מצא את האי. שתפו כדי שגם החברים יגיעו.</p></div><div class="btns"><a class="btn" href="https://instagram.com/${INSTAGRAM}" target="_blank" rel="noopener">📸 ‎@${INSTAGRAM}</a></div>`,
    beach: `<div class="hero"><p>החוף הלאומי. אין מצילים, אבל יהיה בסדר.</p></div><div class="list" style="margin-top:8px">${li("symbols", "🏳️", "סמלי המדינה")}</div>`
  }[id]);
}
function progress() {
  const openAts = S.slots.filter(s => s.city).map(s => s.at), nxt = MILESTONES.find(a => !openAts.includes(a)); if (nxt == null) return "";
  const base = Math.max(0, ...openAts.filter(a => a <= S.total)), pct = Math.max(3, Math.min(100, (S.total - base) / (nxt - base) * 100));
  return `<div class="bar"><i style="width:${pct}%"></i></div><div class="barl"><span>${fmtN(S.total)}</span><span>עיר חדשה ב־${fmtN(nxt)}</span></div>`;
}
function showSlot(sl) {
  if (!sl.city) return open(sl.named ? `🔜 ${sl.named.name}` : "שטח עתידי", `<div class="hero"><p>${sl.named ? `<b>${esc(sl.named.name)}</b> תקום כאן` : "כאן תקום עיר חדשה"} כשהמדינה תגיע ל־<b>${fmtN(sl.at)}</b> תושבים.${sl.named ? "" : " התושבים יבחרו לה שם בתגובות."}</p>${progress()}</div>
    ${sl.named?.founder_username ? `<div class="list" style="margin-top:10px">${info("🏅", `‎@${esc(sl.named.founder_username)}`, "נתנ/ה לעיר את השם")}</div>` : ""}`);
  const c = sl.city, ws = S.workplaces.filter(w => w.city_id === c.id);
  open(c.name, `<div class="stats"><div class="stat"><b>${fmtN(sl.pop)}</b><small>תושבים</small></div><div class="stat"><b>${fmtN(ws.length)}</b><small>עסקים</small></div><div class="stat"><b>${sl.at === 0 ? "בירה" : fmtN(sl.at)}</b><small>${sl.at === 0 ? "מעמד" : "נוסדה בתושב"}</small></div></div>
    <div class="list" style="margin-top:10px">${c.founder_username ? info("🏅", `‎@${esc(c.founder_username)}`, "נתנ/ה לעיר את השם") : info("🗳️", "השם עוד ייבחר", "התושבים יבחרו בתגובות לריל")}${S.mine?.city.id === c.id ? info("📍", "זו העיר שלך") : ""}</div>
    ${ws.length ? `<div class="sec">מקומות עבודה</div><div class="list">${ws.map(w => li("work", KIND_IC[w.kind] || "💼", esc(w.name), `${fmtN(w.staff.length)} עובדים`, w.id)).join("")}</div>` : ""}`);
}
function showWork(w) {
  const staff = [...w.staff].sort((a, b) => b.level - a.level || a.id - b.id), boss = staff[0];
  open(`${KIND_IC[w.kind] || "💼"} ${w.name}`, `<div class="stats"><div class="stat"><b>${fmtN(staff.length)}</b><small>עובדים</small></div><div class="stat"><b>${staff.filter(h => h.level > 1).length}</b><small>בניהול</small></div><div class="stat"><b style="font-size:15px">${esc(cityName(w.city_id))}</b><small>עיר</small></div></div>
    <div class="btns"><button class="btn" data-go="enter" data-arg="${w.id}">🚪 להיכנס פנימה</button></div>
    <div class="list" style="margin-top:10px">${boss && boss.level > 1 ? person(boss, LEVEL[Math.min(4, boss.level)]) : info("👔", "אין עדיין הנהלה", "הקידום הבא בהגרלה יכול להגיע מכאן")}</div>

const THUMBS = new Map(); let TH = null;
function thumb(key, color = "#ffffff") {

  try {
    if (!TH) {
      const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(240, 150, false); r.toneMapping = THREE.ACESFilmicToneMapping;
      const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight("#ffffff", "#8a7a60", 1.7)); const d = new THREE.DirectionalLight("#fff4e0", 2.6); d.position.set(5, 9, 7); sc.add(d);
      sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
      const paint = PAINT.clone(); paint.envMapIntensity = 1;
      TH = { r, sc, cam: new THREE.PerspectiveCamera(28, 240 / 150, .1, 400), paint, mats: { base: new THREE.MeshLambertMaterial({ vertexColors: true }), glow: new THREE.MeshLambertMaterial({ vertexColors: true }), red: new THREE.MeshLambertMaterial({ vertexColors: true }), tint: new THREE.MeshLambertMaterial({ vertexColors: true }), paint } };

    grp.rotation.y = -.6; TH.sc.add(grp);
    const bb = new THREE.Box3().setFromObject(grp), c = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3()).length();
    const dist = size / 2 / Math.tan(THREE.MathUtils.degToRad(14)) * .7;

    THUMBS.set(id, url); return url;
  } catch { return ""; }
}

// The site films itself: a scripted camera flight over the island with Hebrew captions burned in.
// Rendered offline, frame by frame, with exact timestamps (WebCodecs + MP4 muxer), so a 20 second reel is always exactly 20 seconds,
// however slow the phone is. Browsers without WebCodecs fall back to recording the screen in real time.
const REEL = { on: false };

const clamp01 = v => Math.max(0, Math.min(1, v));
const reelFit = () => F * (RW / RH) / (RX0 * S.s * 2.25);

const at = (o, zoom, az = 0, el) => ({ x: o.x, z: o.z, zoom, az, el });

const ORIGIN = { x: 0, z: 0 };
const dayNo = (d = Date.now()) => Math.max(1, Math.floor((new Date(d).getTime() - new Date(INDEPENDENCE_DAY + "T00:00:00").getTime()) / 864e5) + 1);

function chain(list) { list.forEach((s, i) => { if (!s.a) s.a = i ? list[i - 1].b : s.b; }); return list; }

function poseCam(v) {
  const el = v.el ?? BASE_EL, az = BASE_AZ + v.az, vis = F / v.zoom, dist = vis / 2 / Math.tan(THREE.MathUtils.degToRad(reelCam.fov / 2));
  const tg = new THREE.Vector3(v.x, 0, v.z);
  reelCam.position.set(tg.x + Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, tg.z + Math.cos(az) * Math.cos(el) * dist);
  reelCam.near = Math.max(.5, dist * .06); reelCam.far = dist * 10 + 6000; reelCam.updateProjectionMatrix(); reelCam.lookAt(tg);
  scene.fog.near = dist * 1.8; scene.fog.far = dist * 6 + 2500;
  sunFollow(tg, vis * (el < .45 ? 2 : 1.2));
}

function buildSubset(n) { REEL.full ||= { raw: S.raw, total: S.total }; S.raw = REEL.full.raw.slice(0, n); S.total = n; buildWorld(); }
// one frame of the reel at time el (seconds)
function reelFrame(el, dt) {
  const s = REEL.shots.find(q => el < q.t0 + q.d) || REEL.shots.at(-1), k = ease(clamp01((el - s.t0) / s.d));
  if (s !== REEL.shot) {
    REEL.shot = s;
    if (s.build != null && s.build !== S.total) buildSubset(s.build);
    if (s.mark) { S.sel = s.mark; mark(s.mark); } else ring.visible = pin.visible = false;
  }
  const L = (a, b) => a + (b - a) * k, ea = s.a.el ?? BASE_EL, eb = s.b.el ?? BASE_EL;
  poseCam({ x: L(s.a.x, s.b.x), z: L(s.a.z, s.b.z), zoom: Math.exp(L(Math.log(s.a.zoom), Math.log(s.b.zoom))), az: L(s.a.az, s.b.az), el: L(ea, eb) });
  const h = L(s.h[0], s.h[1]); if (Math.abs(h - timeMode.h) > .02) { timeMode = { live: false, h }; applyTime(); scene.fog.color.copy(scene.background); }

    if (REEL.cancelled) { try { enc.close(); } catch {} return null; }
    if (fail) throw fail;

async function fetchCitizens() {
  const out = [], step = 1000;
  for (let from = 0; ; from += step) {
    let data;
    try { data = await api(`citizens?select=${COLSETS[colset]}&order=id`, { Range: `${from}-${from + step - 1}` }); }
    catch (e) { if (e.message === "416") break; if (colset < COLSETS.length - 1) { colset++; out.length = 0; from = -step; continue; } throw e; }
    out.push(...data); if (data.length < step) break;
  }

}
async function loadData() {
  const [cities, citizens, workplaces] = await Promise.all([api("cities?select=id,name,opens_at,founder_username&order=opens_at"), fetchCitizens(), api("workplaces?select=id,name,kind,city_id,color,floors&order=id").catch(() => api("workplaces?select=id,name,kind,city_id&order=id")).catch(() => [])]);

  S.workplaces = workplaces; S.wpById = new Map(workplaces.map(w => [w.id, w]));
  // a city row created before its milestone is only a name waiting for its city
  const live = cities.filter(c => c.opens_at <= citizens.length || !MILESTONES.includes(c.opens_at));
  const slots = SLOTS.map(s => ({ ...s, city: live.find(c => c.opens_at === s.at) || null, named: cities.find(c => c.opens_at === s.at && !live.includes(c)) || null }));

    const [top, dr, pr] = await Promise.all([api("citizens?select=id&order=id.desc&limit=1"), api("draws?select=id&order=id.desc&limit=1").catch(() => []),
      api("projects?select=id,status&order=id").catch(() => S.projects)]);
    const maxId = top[0]?.id || 0, drawId = dr[0]?.id || 0, projChanged = projSig(pr) !== projSig(S.projects);
    if (maxId === S.maxId && drawId === (S.draws[0]?.id || 0) && !projChanged) return;
    const before = S.total, doneBefore = S.projects.filter(p => p.status === "done").length;
    await loadData(); await loadExtras(); await loadProjects(); buildWorld();
    const n = S.total - before, done = S.projects.filter(p => p.status === "done").length - doneBefore;
    toast(n > 0 ? `👋 ${fmtN(n)} תושבים חדשים הגיעו לאי` : done > 0 ? "🎉 נחנך מבנה חדש שביקשתם!" : projChanged ? "🏗️ התחילו לבנות משהו חדש" : "🎟️ יש זוכים חדשים בהגרלה");
  } catch {}
}

/* ============================ BOOT ============================ */
async function boot() {
  const day = Math.max(1, Math.floor((Date.now() - new Date(INDEPENDENCE_DAY + "T00:00:00").getTime()) / 864e5) + 1);
  $("hudDay").textContent = "יום " + fmtN(day);
  applyTime();
  try { await loadData(); } catch (e) { console.error(e); toast("לא הצלחנו לטעון את המדינה. נסו לרענן."); S.raw = []; S.slots = SLOTS.map(s => ({ ...s, city: null })); }
  $("loadMsg").textContent = "מחלקים מפתחות לבתים…"; await new Promise(r => setTimeout(r, 30));
  await loadExtras(); await loadProjects();
  try { await Promise.all([document.fonts.load("800 64px Heebo"), document.fonts.load("700 64px Heebo")]); } catch {}
  buildWorld(); applyTime();
  const cap = S.slots[0];
  controls.target.set(0, 0, 0); camera.position.copy(VIEW_DIR).multiplyScalar(2000); setZoom(fitZoom());
  requestAnimationFrame(loop);
  setTimeout(() => { $("loader").classList.add("gone"); flyTo(cap.x, cap.z, 2.2, 2400); }, 500);
  const qs = new URLSearchParams(location.search), pre = qs.get("u"), k = qs.get("k");
  // the personal link from Instagram: remember the key on this phone and take it out of the address bar, so it isn't shared by mistake
  if (pre && k) { saveKey(clean(pre), k); history.replaceState(null, "", `?u=${encodeURIComponent(clean(pre))}`); }
  if (pre) { $("q").value = "@" + clean(pre); setTimeout(() => { find(pre); const h = S.byUser.get(clean(pre));
    if (h && keyOf(h.u) && h.coins != null && !collectedToday(h)) setTimeout(() => toast(`💼 המשכורת היומית שלך מחכה: +${fmtN(salaryOf(h))} ${COIN}`, 4000), 1900); }, 3000); }
  initAdmin(qs);
  if (qs.has("debug")) window.GO = GO;
  setTimeout(loadBallot, 3600);
  setInterval(refresh, REFRESH_MS);
}
// admin mode: open the site with ?admin once, type the code that upgrade-5.sql printed, and this phone remembers it
let ADMIN = false;
async function initAdmin(qs) {
  let code = null; try { code = localStorage.getItem("sababa_admin"); } catch {}
  if (qs.has("admin")) {
    const rest = new URLSearchParams(qs); rest.delete("admin"); history.replaceState(null, "", rest.toString() ? "?" + rest : location.pathname);
    code = (prompt("קוד מנהל:") || "").trim(); if (!code) return;
  }
  if (!code) return;
  let ok = false; try { ok = (await rpc("admin_check", { secret: code })) === true; } catch {}
  if (ok) { ADMIN = true; try { localStorage.setItem("sababa_admin", code); } catch {} if (qs.has("admin")) toast("👑 מצב מנהל פעיל. כל תבניות הרילים פתוחות בסטודיו"); }
  else { try { localStorage.removeItem("sababa_admin"); } catch {} if (qs.has("admin")) toast("קוד מנהל שגוי"); }
}
boot();
